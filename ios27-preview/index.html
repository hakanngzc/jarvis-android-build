<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Glass Home Preview</title>
<style>
:root{
  --glass:.22; --blur:28px; --radius:30px; --icon:66px; --gap:18px;
  --text:#fff; --shadow:0 12px 36px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1017;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{touch-action:none}
.wallpaper{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 22% 12%,rgba(255,151,91,.95),transparent 26%),
    radial-gradient(circle at 78% 28%,rgba(123,89,255,.9),transparent 28%),
    radial-gradient(circle at 62% 85%,rgba(40,167,255,.85),transparent 31%),
    linear-gradient(145deg,#100d1d 0%,#291244 39%,#0a2238 100%);
  transform:scale(1.06);
}
.wallpaper:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.03),rgba(0,0,0,.16));
}
.phone{position:relative;width:100%;height:100%;max-width:480px;margin:auto;overflow:hidden}
.status{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:0;right:0;height:28px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.status .right{display:flex;gap:7px;align-items:center}
.battery{width:24px;height:11px;border:1.7px solid #fff;border-radius:3px;position:relative}
.battery:before{content:"";position:absolute;inset:2px;background:#fff;border-radius:1px}
.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:#fff;border-radius:0 1px 1px 0}
.workspace{position:absolute;inset:0;z-index:3;transition:transform .34s cubic-bezier(.2,.75,.2,1);will-change:transform;display:flex}
.page{min-width:100%;height:100%;padding:58px 18px 158px;display:flex;flex-direction:column}
.widget{
  height:132px;border-radius:32px;padding:18px 20px;margin:0 2px 20px;
  background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.28);box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35);
  display:flex;justify-content:space-between;overflow:hidden;position:relative
}
.widget:after{content:"";position:absolute;left:-40%;top:-60%;width:75%;height:180%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(16deg)}
.weather .big{font-size:42px;font-weight:300;letter-spacing:-2px}
.weather .place{font-weight:700;font-size:16px}
.weather .meta{font-size:13px;opacity:.86;margin-top:3px}
.weather .sun{font-size:58px;filter:drop-shadow(0 8px 18px rgba(255,190,74,.35))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);column-gap:12px;row-gap:18px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none}
.icon{
  width:var(--icon);height:var(--icon);border-radius:17px;display:grid;place-items:center;
  font-size:31px;box-shadow:0 7px 20px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4);
  position:relative;overflow:hidden;transform-origin:center;transition:transform .18s
}
.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.28),transparent 36%,rgba(255,255,255,.08));pointer-events:none}
.label{font-size:12.5px;text-shadow:0 1px 4px rgba(0,0,0,.65);white-space:nowrap;max-width:82px;overflow:hidden;text-overflow:ellipsis}
.c1{background:linear-gradient(145deg,#38a6ff,#0964ff)} .c2{background:linear-gradient(145deg,#ff5b66,#ff2d55)}
.c3{background:linear-gradient(145deg,#4adf87,#13a950)} .c4{background:linear-gradient(145deg,#fff,#d8e1e8);color:#111}
.c5{background:linear-gradient(145deg,#ffbd3f,#ff7417)} .c6{background:linear-gradient(145deg,#914dff,#5720ca)}
.c7{background:linear-gradient(145deg,#2c2c2e,#050505)} .c8{background:linear-gradient(145deg,#50d0ff,#1f81ff)}
.c9{background:linear-gradient(145deg,#ff536d,#ff1b41)} .c10{background:linear-gradient(145deg,#55db62,#15902b)}
.c11{background:linear-gradient(145deg,#fafafa,#bfc8d1);color:#111} .c12{background:linear-gradient(145deg,#5f6c7b,#222a34)}
.dock{
  position:absolute;z-index:12;left:16px;right:16px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 8px));height:92px;border-radius:31px;
  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.11));
  border:1px solid rgba(255,255,255,.28);box-shadow:0 18px 45px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.24);
  backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 14px
}
.dock .icon{width:65px;height:65px;margin:auto}
.dots{position:absolute;z-index:13;left:0;right:0;bottom:120px;display:flex;gap:7px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.42);transition:.25s}
.dot.active{background:#fff;transform:scale(1.15)}
.search-pill{position:absolute;z-index:13;bottom:117px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:14px;font-size:11px;display:none}
.jiggle .icon{animation:jiggle .18s infinite alternate}
.jiggle .app:nth-child(2n) .icon{animation-delay:.05s}
@keyframes jiggle{from{transform:rotate(-1.7deg) scale(.98)}to{transform:rotate(1.7deg) scale(.98)}}
.minus{display:none;position:absolute;z-index:4;top:-5px;left:-5px;width:20px;height:20px;border-radius:50%;background:#ececec;color:#222;font:bold 16px/20px Arial;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.jiggle .minus{display:block}
.library-title{font-size:30px;font-weight:800;margin:4px 6px 14px;letter-spacing:-1px}
.lib-search{height:42px;border-radius:18px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 14px;margin:0 4px 18px;font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto;padding:0 4px 6px}
.cat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.17);backdrop-filter:blur(20px);border-radius:28px;padding:12px;min-height:148px}
.cat h3{font-size:13px;margin:0 0 9px 3px}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.mini .icon{width:50px;height:50px;border-radius:14px;font-size:24px}
.overlay{position:absolute;z-index:40;inset:0;background:rgba(7,9,15,.42);backdrop-filter:blur(28px) saturate(1.25);-webkit-backdrop-filter:blur(28px) saturate(1.25);opacity:0;pointer-events:none;transition:.28s;padding:64px 18px 24px}
.overlay.show{opacity:1;pointer-events:auto}
.spot{height:50px;border-radius:20px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.23);display:flex;align-items:center;padding:0 15px;gap:10px;box-shadow:var(--shadow)}
.spot input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:17px}
.spot input::placeholder{color:rgba(255,255,255,.7)}
.results{margin-top:16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:10px}
.result{height:58px;display:flex;align-items:center;gap:12px;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.09)}
.result:last-child{border:0}.result .icon{width:40px;height:40px;border-radius:11px;font-size:19px}
.folder-wrap{position:absolute;z-index:35;inset:0;background:rgba(0,0,0,.22);backdrop-filter:blur(14px);display:none;place-items:center;padding:22px}
.folder-wrap.show{display:grid}
.folder{width:min(340px,92vw);border-radius:36px;background:rgba(230,235,245,.22);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(30px) saturate(1.35);padding:22px 18px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.folder h2{text-align:center;font-size:20px;margin:0 0 20px}.folder .grid{grid-template-columns:repeat(3,1fr);gap:20px 12px}
.toast{position:absolute;z-index:60;top:48px;left:50%;transform:translate(-50%,-10px);opacity:0;background:rgba(20,20,25,.72);backdrop-filter:blur(18px);padding:10px 16px;border-radius:18px;font-size:12px;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:390px){:root{--icon:60px}.page{padding-left:14px;padding-right:14px}.dock .icon{width:60px;height:60px}.grid{row-gap:15px}}
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="phone" id="phone">
  <div class="status"><span id="clock">16:45</span><div class="right"><span>▮▮▮</span><span>⌁</span><div class="battery"></div></div></div>
  <div class="workspace" id="workspace">
    <section class="page" id="home1">
      <div class="widget weather">
        <div><div class="place">Sakarya</div><div class="big">24°</div><div class="meta">Parçalı bulutlu · H:27° L:17°</div></div>
        <div class="sun">🌤️</div>
      </div>
      <div class="grid" id="grid1"></div>
    </section>
    <section class="page">
      <div class="widget">
        <div><div class="place">Bugün</div><div style="font-size:26px;font-weight:750;margin-top:6px">Pazartesi</div><div class="meta">28 Eylül · 3 etkinlik</div></div>
        <div style="font-size:54px">📅</div>
      </div>
      <div class="grid" id="grid2"></div>
    </section>
    <section class="page">
      <div class="library-title">Uygulama Arşivi</div>
      <div class="lib-search">🔎&nbsp;&nbsp; Uygulamalar</div>
      <div class="cards" id="cards"></div>
    </section>
  </div>
  <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="dock" id="dock"></div>

  <div class="overlay" id="spotlight">
    <div class="spot"><span>🔎</span><input id="searchInput" placeholder="Ara" autocomplete="off"><span id="closeSearch">İptal</span></div>
    <div class="results" id="results"></div>
  </div>

  <div class="folder-wrap" id="folderWrap">
    <div class="folder"><h2>Sosyal</h2><div class="grid" id="folderGrid"></div></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const apps=[
["Telefon","📞","c3"],["Mesajlar","💬","c10"],["Safari","🧭","c8"],["Kamera","📷","c11"],
["Fotoğraflar","🌼","c4"],["Haritalar","🗺️","c8"],["Hava","🌤️","c8"],["Saat","🕘","c7"],
["Takvim","28","c4"],["Notlar","📝","c5"],["Müzik","♪","c9"],["Ayarlar","⚙️","c12"],
["YouTube","▶","c2"],["Spotify","●","c3"],["Instagram","◎","c6"],["WhatsApp","◉","c10"],
["TikTok","♪","c7"],["X","𝕏","c7"],["Netflix","N","c2"],["Galeri","🖼️","c6"],
["Dosyalar","📁","c8"],["Hesap Mak.","＋","c12"],["Takvim","📅","c4"],["Mağaza","A","c8"]
];
const dockApps=[["Telefon","📞","c3"],["Safari","🧭","c8"],["Mesajlar","💬","c10"],["Müzik","♪","c9"]];
function tile(a,mini=false){
 const el=document.createElement("div"); el.className="app";
 el.innerHTML='<div class="icon '+a[2]+'"><span class="minus">−</span>'+a[1]+'</div>'+(mini?'':'<div class="label">'+a[0]+'</div>');
 el.dataset.name=a[0];
 return el;
}
function fill(id,arr){const e=document.getElementById(id);arr.forEach(a=>e.appendChild(tile(a)))}
fill("grid1",apps.slice(0,12)); fill("grid2",apps.slice(12,24));
dockApps.forEach(a=>document.getElementById("dock").appendChild(tile(a,true)));
const cats=[["Sosyal",apps.slice(14,18)],["Eğlence",[apps[12],apps[13],apps[18],apps[10]]],["Araçlar",[apps[20],apps[21],apps[11],apps[7]]],["Öneriler",[apps[0],apps[2],apps[6],apps[8]]]];
cats.forEach(c=>{let x=document.createElement("div");x.className="cat";x.innerHTML="<h3>"+c[0]+"</h3><div class='mini'></div>";c[1].forEach(a=>x.querySelector(".mini").appendChild(tile(a,true)));document.getElementById("cards").appendChild(x)});
apps.slice(14,18).forEach(a=>document.getElementById("folderGrid").appendChild(tile(a)));

let page=0,startX=0,startY=0,dx=0,dy=0,longTimer=null,jiggle=false;
const ws=document.getElementById("workspace"), phone=document.getElementById("phone"), dots=[...document.querySelectorAll(".dot")];
function go(n){page=Math.max(0,Math.min(2,n));ws.style.transform="translateX("+(-page*100)+"%)";dots.forEach((d,i)=>d.classList.toggle("active",i===page))}
phone.addEventListener("pointerdown",e=>{
 startX=e.clientX;startY=e.clientY;dx=dy=0;
 longTimer=setTimeout(()=>{jiggle=true;document.querySelectorAll(".page").forEach(p=>p.classList.add("jiggle"));toast("Düzenleme modu")},520)
});
phone.addEventListener("pointermove",e=>{dx=e.clientX-startX;dy=e.clientY-startY;if(Math.abs(dx)>8||Math.abs(dy)>8)clearTimeout(longTimer)});
phone.addEventListener("pointerup",e=>{
 clearTimeout(longTimer);
 if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){go(page+(dx<0?1:-1));return}
 if(dy>85&&Math.abs(dy)>Math.abs(dx)){openSearch();return}
});
document.addEventListener("click",e=>{
 const app=e.target.closest(".app"); if(!app)return;
 if(jiggle){return}
 const name=app.dataset.name;
 if(name==="Instagram"||name==="WhatsApp"){document.getElementById("folderWrap").classList.add("show");return}
 toast(name+" açılıyor");
});
document.getElementById("folderWrap").onclick=e=>{if(e.target.id==="folderWrap")e.currentTarget.classList.remove("show")};
document.getElementById("closeSearch").onclick=closeSearch;
function openSearch(){document.getElementById("spotlight").classList.add("show");setTimeout(()=>document.getElementById("searchInput").focus(),120);renderResults("")}
function closeSearch(){document.getElementById("spotlight").classList.remove("show");document.getElementById("searchInput").blur()}
const input=document.getElementById("searchInput");input.oninput=()=>renderResults(input.value);
function renderResults(q){
 const r=document.getElementById("results");r.innerHTML="";
 apps.filter(a=>a[0].toLowerCase().includes(q.toLowerCase())).slice(0,6).forEach(a=>{
  const row=document.createElement("div");row.className="result";row.innerHTML='<div class="icon '+a[2]+'">'+a[1]+'</div><div><b>'+a[0]+'</b><div style="font-size:12px;opacity:.68">Uygulama</div></div>';r.appendChild(row)
 })
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)}
setInterval(()=>{let d=new Date();document.getElementById("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")},1000);
document.addEventListener("dblclick",()=>{if(jiggle){jiggle=false;document.querySelectorAll(".page").forEach(p=>p.classList.remove("jiggle"));toast("Düzenleme tamamlandı")}});
</script>
</body>
</html>
