<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Glass Home · iOS 27 Preview</title>
<style>
:root{
  --fg:#fff;
  --glass-bg:rgba(255,255,255,.16);
  --glass-bg-strong:rgba(255,255,255,.22);
  --glass-border:rgba(255,255,255,.28);
  --glass-shadow:0 18px 48px rgba(0,0,0,.22);
  --icon-size:64px;
  --label-shadow:0 1px 5px rgba(0,0,0,.62);
  --blur:28px;
  --radius:29px;
  --accent:rgba(112,185,255,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;background:#09111a;color:var(--fg)}
body{touch-action:none}
.wallpaper{
  position:fixed;inset:-3%;
  background:
    radial-gradient(circle at 22% 18%,rgba(255,178,105,.98),transparent 18%),
    radial-gradient(circle at 77% 20%,rgba(107,105,255,.95),transparent 23%),
    radial-gradient(circle at 55% 64%,rgba(67,184,255,.85),transparent 28%),
    radial-gradient(circle at 18% 88%,rgba(41,67,115,.95),transparent 27%),
    linear-gradient(150deg,#111321 0%,#351a42 36%,#10253f 72%,#09131d 100%);
  filter:saturate(1.12);
  transform:scale(1.06);
}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.02) 42%,rgba(0,0,0,.18))}
.phone{position:relative;width:100%;height:100%;max-width:480px;margin:auto;overflow:hidden}
.status{
  position:absolute;z-index:30;top:max(9px,env(safe-area-inset-top));left:0;right:0;height:30px;padding:0 23px;
  display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;
  text-shadow:0 1px 5px rgba(0,0,0,.45);pointer-events:none
}
.status-right{display:flex;align-items:center;gap:7px;font-size:12px}
.signal{letter-spacing:-1px}.battery-mini{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.92);border-radius:3px;position:relative}
.battery-mini:before{content:"";position:absolute;inset:2px 4px 2px 2px;border-radius:1px;background:#fff}
.battery-mini:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#fff;border-radius:0 1px 1px 0}
.island{
  position:absolute;z-index:29;top:max(9px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:86px;height:25px;border-radius:18px;background:#050505;box-shadow:0 1px 0 rgba(255,255,255,.05)
}
.workspace{position:absolute;inset:0;display:flex;z-index:2;transition:transform .34s cubic-bezier(.2,.72,.2,1);will-change:transform}
.page{min-width:100%;height:100%;padding:54px 16px 150px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 4px 14px}
.widget{
  min-height:146px;border-radius:31px;background:var(--glass-bg);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.26);position:relative;overflow:hidden
}
.widget:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.25),rgba(255,255,255,.04) 34%,transparent 60%);
  mix-blend-mode:screen
}
.widget.clock{display:grid;place-items:center;padding:12px}
.clockface{width:118px;height:118px;border-radius:50%;position:relative;background:radial-gradient(circle at 45% 40%,rgba(255,255,255,.16),rgba(0,0,0,.24));border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 0 28px rgba(255,255,255,.05)}
.clockface .tick{position:absolute;left:50%;top:50%;width:2px;height:45%;transform-origin:50% 100%;background:linear-gradient(#fff 0 8px,transparent 8px);opacity:.9}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px}
.hour{width:5px;height:31px;background:#fff;transform:translateX(-50%) rotate(155deg)}
.minute{width:4px;height:43px;background:#fff;transform:translateX(-50%) rotate(18deg)}
.second{width:1.5px;height:46px;background:#ffb12b;transform:translateX(-50%) rotate(92deg)}
.pin{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffad24;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.calendar{padding:16px 15px 12px}
.cal-title{font-size:17px;font-weight:800;letter-spacing:.2px;margin-bottom:10px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:10px}
.week{opacity:.62;margin-bottom:8px}.days{font-size:12px;font-weight:600}
.day{height:17px;line-height:17px;border-radius:9px}.today{background:#ff3b30;color:#fff}
.battery{padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.battery-top{font-size:13px;font-weight:700;opacity:.82}.battery-value{font-size:44px;font-weight:300;letter-spacing:-2px}
.ring{width:47px;height:47px;border-radius:50%;background:conic-gradient(#46e675 0 75%,rgba(255,255,255,.18) 75%);display:grid;place-items:center}
.ring:after{content:"";width:33px;height:33px;border-radius:50%;background:rgba(18,23,29,.86)}
.photo{
  background:
    radial-gradient(circle at 67% 22%,rgba(255,183,98,.75),transparent 22%),
    linear-gradient(165deg,rgba(22,35,48,.05),rgba(8,12,18,.32)),
    url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=82') center 32%/cover no-repeat;
}
.photo:after{content:"Fotoğraflar";position:absolute;left:14px;bottom:12px;font-size:11px;font-weight:700;text-shadow:0 1px 5px rgba(0,0,0,.55)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 10px;margin:0 2px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;user-select:none}
.icon{
  width:var(--icon-size);height:var(--icon-size);border-radius:17px;display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:0 8px 22px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.35);font-size:28px;font-weight:700;
  transition:transform .17s ease,filter .2s ease
}
.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.28),transparent 38%,rgba(255,255,255,.04));pointer-events:none}
.label{font-size:12px;white-space:nowrap;max-width:82px;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--label-shadow)}
.c-blue{background:linear-gradient(145deg,#5bc3ff,#2377ff)}.c-green{background:linear-gradient(145deg,#4fe873,#16ae47)}
.c-red{background:linear-gradient(145deg,#ff676f,#f2263e)}.c-purple{background:linear-gradient(145deg,#b56bff,#6d2ae2)}
.c-black{background:linear-gradient(145deg,#2a2b2e,#050505)}.c-white{background:linear-gradient(145deg,#fff,#dbe1e8);color:#111}
.c-orange{background:linear-gradient(145deg,#ffcf5b,#ff7a21)}.c-pink{background:linear-gradient(145deg,#ff7db8,#ff315e)}
.c-gray{background:linear-gradient(145deg,#88929d,#313a44)}
.search-pill{
  position:absolute;z-index:14;left:50%;bottom:113px;transform:translateX(-50%);
  height:30px;padding:0 12px;border-radius:18px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(18px) saturate(1.45);-webkit-backdrop-filter:blur(18px) saturate(1.45);
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;box-shadow:0 8px 18px rgba(0,0,0,.18)
}
.dots{position:absolute;z-index:14;left:0;right:0;bottom:105px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.36)}.dot.active{background:#fff}
.dock{
  position:absolute;z-index:14;left:13px;right:13px;bottom:max(13px,calc(env(safe-area-inset-bottom) + 6px));height:92px;border-radius:33px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(32px) saturate(1.65);-webkit-backdrop-filter:blur(32px) saturate(1.65);
  box-shadow:0 22px 48px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.30);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 13px;overflow:hidden
}
.dock:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.19),transparent 42%,rgba(255,255,255,.06));pointer-events:none}
.dock .icon{width:64px;height:64px}.dock .label{display:none}
.library-title{font-size:29px;font-weight:800;letter-spacing:-.8px;margin:3px 5px 12px}
.library-search{
  height:45px;border-radius:22px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 14px;margin:0 3px 16px;font-size:14px
}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:calc(100% - 78px);overflow:auto;padding:0 3px 20px}
.cat{
  min-height:154px;border-radius:28px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.20);
  backdrop-filter:blur(26px) saturate(1.45);-webkit-backdrop-filter:blur(26px) saturate(1.45);padding:11px;box-shadow:0 10px 28px rgba(0,0,0,.16)
}
.cat h3{font-size:12px;margin:0 0 8px 2px}.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mini .icon{width:51px;height:51px;border-radius:14px;font-size:20px}
.overlay{position:absolute;z-index:50;inset:0;padding:57px 16px 22px;background:rgba(14,18,26,.28);backdrop-filter:blur(31px) saturate(1.3);opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.spot{height:48px;border-radius:22px;background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--glass-shadow)}
.spot input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:17px}.spot input::placeholder{color:rgba(255,255,255,.65)}
.results{margin-top:14px;border-radius:27px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.result{height:61px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08)}.result:last-child{border-bottom:0}
.result .icon{width:41px;height:41px;border-radius:12px;font-size:18px}
.customizer{
  position:absolute;z-index:45;left:50%;bottom:118px;transform:translate(-50%,18px);opacity:0;pointer-events:none;
  display:flex;gap:7px;padding:7px;border-radius:24px;background:rgba(40,44,53,.56);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(22px);transition:.22s
}
.customizer.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.mode{border:0;color:#fff;background:rgba(255,255,255,.10);padding:7px 10px;border-radius:16px;font-size:11px}.mode.active{background:rgba(255,255,255,.28)}
.clear-mode .icon{background:rgba(255,255,255,.12)!important;color:#fff;backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.18)}
.clear-mode .widget,.clear-mode .dock,.clear-mode .cat{background:rgba(255,255,255,.11)}
.tint-mode .icon{background:linear-gradient(145deg,rgba(127,181,255,.60),rgba(59,101,171,.44))!important;color:#fff}
.tint-mode .widget,.tint-mode .dock,.tint-mode .cat{background:rgba(91,132,190,.23)}
.jiggle .icon{animation:jiggle .17s infinite alternate}.jiggle .app:nth-child(even) .icon{animation-delay:.04s}
@keyframes jiggle{from{transform:rotate(-1.6deg) scale(.985)}to{transform:rotate(1.6deg) scale(.985)}}
.toast{position:absolute;z-index:70;top:48px;left:50%;transform:translate(-50%,-10px);opacity:0;background:rgba(20,22,27,.66);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(20px);padding:9px 14px;border-radius:17px;font-size:12px;transition:.22s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.edit-top{
  position:absolute;z-index:46;top:max(48px,calc(env(safe-area-inset-top) + 40px));left:14px;right:14px;
  display:flex;justify-content:space-between;align-items:center;opacity:0;pointer-events:none;transform:translateY(-8px);transition:.22s
}
.edit-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.edit-btn{
  height:36px;padding:0 13px;border:1px solid rgba(255,255,255,.23);border-radius:18px;color:#fff;
  background:rgba(35,40,48,.48);backdrop-filter:blur(22px) saturate(1.4);font-size:12px;font-weight:700
}
.remove-badge{
  display:none;position:absolute;z-index:4;left:-5px;top:-5px;width:22px;height:22px;border-radius:50%;
  background:rgba(240,240,244,.96);color:#1b1c20;font:700 17px/20px Arial;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.32);border:1px solid rgba(0,0,0,.06)
}
.jiggle .remove-badge{display:block}
.glass-sheen{
  position:absolute;inset:-60% -30%;pointer-events:none;opacity:.34;
  background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.28) 49%,rgba(255,255,255,.05) 56%,transparent 66%);
  transform:translateX(var(--sheen-x,-18%)) rotate(8deg);transition:transform .12s linear
}
.folder-overlay{
  position:absolute;z-index:49;inset:0;display:grid;place-items:center;padding:18px;
  background:rgba(8,12,18,.22);backdrop-filter:blur(30px) saturate(1.25);opacity:0;pointer-events:none;transition:.24s
}
.folder-overlay.show{opacity:1;pointer-events:auto}
.folder-card{
  width:min(340px,92vw);padding:20px 18px 24px;border-radius:36px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(34px) saturate(1.55);
  box-shadow:0 25px 70px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.26);transform:scale(.92);transition:.24s
}
.folder-overlay.show .folder-card{transform:scale(1)}
.folder-title{text-align:center;font-size:18px;font-weight:750;margin:0 0 18px}
.folder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px}
.folder-grid .icon{width:61px;height:61px}.folder-grid .label{font-size:11px}
.control{
  position:absolute;z-index:55;right:10px;top:max(48px,calc(env(safe-area-inset-top) + 40px));width:min(320px,82vw);
  border-radius:34px;padding:14px;background:rgba(30,37,48,.34);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(34px) saturate(1.5);box-shadow:0 24px 70px rgba(0,0,0,.32);
  opacity:0;pointer-events:none;transform:translateY(-18px) scale(.96);transition:.24s
}
.control.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{min-height:88px;border-radius:25px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);padding:13px}
.ccard.big{grid-column:1/-1;min-height:74px}
.toggle-row{display:flex;gap:10px;flex-wrap:wrap}
.toggle{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:18px}
.toggle.on{background:rgba(50,139,255,.86)}
.slider{height:8px;border-radius:8px;background:rgba(255,255,255,.16);margin-top:16px;overflow:hidden}
.slider span{display:block;height:100%;width:72%;background:#fff;border-radius:8px}
.island-expanded{
  position:absolute;z-index:60;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(.94);
  width:255px;height:70px;border-radius:32px;background:#050505;color:#fff;opacity:0;pointer-events:none;transition:.22s;
  padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.35)
}
.island-expanded.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.album{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#624cff,#ff4d8d);display:grid;place-items:center;font-size:22px}
.eq{margin-left:auto;display:flex;align-items:end;gap:2px;height:20px}.eq i{width:3px;border-radius:2px;background:#69e68c;animation:eq .7s infinite alternate}.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:5px}to{height:20px}}
.library-search input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:14px}
.library-search input::placeholder{color:rgba(255,255,255,.68)}
.cat{cursor:pointer}
.cat .mini .app:nth-child(n+4){transform:scale(.82)}

.widget-gallery{
  position:absolute;z-index:58;inset:0;padding:58px 15px 18px;background:rgba(10,14,20,.25);
  backdrop-filter:blur(32px) saturate(1.28);-webkit-backdrop-filter:blur(32px) saturate(1.28);
  opacity:0;pointer-events:none;transition:.24s
}
.widget-gallery.show{opacity:1;pointer-events:auto}
.widget-sheet{
  height:100%;border-radius:34px 34px 0 0;background:rgba(30,35,44,.34);border:1px solid rgba(255,255,255,.20);
  backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);
  box-shadow:0 -12px 42px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.20);
  padding:16px 14px 28px;overflow:auto;transform:translateY(14px);transition:.24s
}
.widget-gallery.show .widget-sheet{transform:translateY(0)}
.widget-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
.widget-head h2{font-size:25px;letter-spacing:-.7px;margin:0}
.widget-close{width:34px;height:34px;border:0;border-radius:50%;color:#fff;background:rgba(255,255,255,.14);font-size:18px}
.widget-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wopt{
  min-height:154px;border-radius:28px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.17);
  padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 28px rgba(0,0,0,.12)
}
.wpreview{height:94px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;overflow:hidden}
.wopt b{font-size:13px}.wopt small{font-size:10px;opacity:.58}
.custom-zone{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 4px 14px}
.custom-zone:empty{display:none}
.custom-widget{
  min-height:126px;border-radius:28px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(26px) saturate(1.48);-webkit-backdrop-filter:blur(26px) saturate(1.48);
  box-shadow:0 12px 30px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.20);
  padding:15px;position:relative;overflow:hidden
}
.custom-widget.wide{grid-column:1/-1;min-height:112px}
.custom-widget .remove-widget{
  display:none;position:absolute;z-index:5;left:8px;top:8px;width:22px;height:22px;border:0;border-radius:50%;
  background:#f1f1f4;color:#222;font:700 16px/21px Arial;box-shadow:0 2px 8px rgba(0,0,0,.25)
}
.jiggle-zone .remove-widget{display:block}
.dragging-app{opacity:.18!important}
.drag-ghost{
  position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))
}
.drag-ghost .label{display:none}
.apps.drag-active{outline:1px solid rgba(255,255,255,.14);outline-offset:8px;border-radius:22px}
.save-chip{
  position:absolute;z-index:47;left:50%;top:max(50px,calc(env(safe-area-inset-top) + 42px));transform:translateX(-50%);
  padding:7px 11px;border-radius:16px;background:rgba(20,24,31,.46);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(18px);font-size:11px;opacity:0;pointer-events:none;transition:.2s
}
.save-chip.show{opacity:1}
@media(max-width:390px){:root{--icon-size:59px}.page{padding-left:13px;padding-right:13px}.hero-grid{gap:10px}.widget{min-height:136px}.dock .icon{width:59px;height:59px}.apps{gap:13px 7px}}
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="phone" id="phone">
  <div class="island"></div>
  <div class="status"><span id="clock">17:02</span><div class="status-right"><span class="signal">▮▮▮▮</span><span>5G</span><div class="battery-mini"></div></div></div>

  <div class="workspace" id="workspace">
    <section class="page" id="homePage">
      <div class="hero-grid">
        <div class="widget clock">
          <div class="clockface" id="clockface">
            <div class="hand hour"></div><div class="hand minute"></div><div class="hand second"></div><div class="pin"></div>
          </div>
        </div>
        <div class="widget calendar">
          <div class="cal-title">EYLÜL</div>
          <div class="week"><span>P</span><span>S</span><span>Ç</span><span>P</span><span>C</span><span>C</span><span>P</span></div>
          <div class="days" id="days"></div>
        </div>
        <div class="widget battery">
          <div style="display:flex;align-items:center;justify-content:space-between"><div class="battery-top">Pil</div><div class="ring"></div></div>
          <div><div class="battery-value">75%</div><div style="font-size:12px;opacity:.68">Yaklaşık 6 sa 20 dk</div></div>
        </div>
        <div class="widget photo"></div>
      </div>
      <div class="apps" id="apps1"></div>
    </section>

    <section class="page">
      <div class="hero-grid" style="grid-template-columns:1.25fr .75fr">
        <div class="widget" style="padding:18px">
          <div style="font-size:13px;font-weight:700;opacity:.82">Onikişubat</div>
          <div style="font-size:48px;font-weight:300;letter-spacing:-2px;margin-top:7px">20°</div>
          <div style="font-size:13px">Bulutlu</div>
          <div style="font-size:11px;opacity:.66;margin-top:4px">Y:25° · D:17°</div>
        </div>
        <div class="widget" style="padding:18px;display:flex;flex-direction:column;justify-content:space-between">
          <div style="font-size:12px;font-weight:700;opacity:.78">Şimdi Çalıyor</div>
          <div style="font-size:27px">♪</div>
          <div><div style="font-size:12px;font-weight:700">Müzik</div><div style="font-size:10px;opacity:.62">Duraklatıldı</div></div>
        </div>
      </div>
      <div class="custom-zone" id="customZone"></div>
      <div class="apps" id="apps2"></div>
    </section>

    <section class="page">
      <div class="library-title">Uygulama Arşivi</div>
      <div class="library-search">⌕&nbsp;&nbsp;<input id="libraryInput" placeholder="Uygulamalar" autocomplete="off"></div>
      <div class="lib-grid" id="libGrid"></div>
    </section>
  </div>

  <div class="search-pill" id="searchPill">⌕ Ara</div>
  <div class="dots" id="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="dock" id="dock"><div class="glass-sheen"></div></div>

  <div class="edit-top" id="editTop">
    <button class="edit-btn" id="addWidget">＋ Widget</button>
    <button class="edit-btn" id="doneEdit">Bitti</button>
  </div>

  <div class="customizer" id="customizer">
    <button class="mode active" data-mode="normal">Varsayılan</button>
    <button class="mode" data-mode="clear">Clear</button>
    <button class="mode" data-mode="tint">Tinted</button>
  </div>

  <div class="save-chip" id="saveChip">Düzen kaydedildi</div>

  <div class="widget-gallery" id="widgetGallery">
    <div class="widget-sheet">
      <div class="widget-head"><h2>Widget Ekle</h2><button class="widget-close" id="closeWidgets">×</button></div>
      <div class="widget-options">
        <button class="wopt" data-widget="weather" style="border:0;color:#fff;text-align:left">
          <div class="wpreview"><div style="font-size:34px">20° ☁</div></div><div><b>Hava Durumu</b><br><small>2 × 2</small></div>
        </button>
        <button class="wopt" data-widget="battery" style="border:0;color:#fff;text-align:left">
          <div class="wpreview"><div style="font-size:34px">◔ 75%</div></div><div><b>Pil</b><br><small>2 × 2</small></div>
        </button>
        <button class="wopt" data-widget="calendar" style="border:0;color:#fff;text-align:left">
          <div class="wpreview"><div style="font-size:34px">28</div></div><div><b>Takvim</b><br><small>2 × 2</small></div>
        </button>
        <button class="wopt" data-widget="photo" style="border:0;color:#fff;text-align:left">
          <div class="wpreview" style="background:linear-gradient(145deg,#7b5cff,#ff8c62)">✦</div><div><b>Fotoğraflar</b><br><small>2 × 2</small></div>
        </button>
        <button class="wopt" data-widget="music" style="border:0;color:#fff;text-align:left;grid-column:1/-1">
          <div class="wpreview"><div style="font-size:25px">♪ Şimdi Çalıyor</div></div><div><b>Müzik</b><br><small>4 × 2</small></div>
        </button>
      </div>
    </div>
  </div>

  <div class="folder-overlay" id="folderOverlay">
    <div class="folder-card">
      <div class="folder-title" id="folderTitle">Sosyal</div>
      <div class="folder-grid" id="folderGrid"></div>
    </div>
  </div>

  <div class="control" id="controlCenter">
    <div class="control-grid">
      <div class="ccard">
        <div class="toggle-row"><div class="toggle on">⌁</div><div class="toggle on">◉</div><div class="toggle">✈</div><div class="toggle">◔</div></div>
      </div>
      <div class="ccard"><div style="font-size:11px;opacity:.68">Parlaklık</div><div class="slider"><span></span></div></div>
      <div class="ccard big"><div style="font-size:11px;opacity:.68">Şimdi Çalıyor</div><div style="font-size:15px;font-weight:700;margin-top:7px">Müzik · Duraklatıldı</div></div>
    </div>
  </div>

  <div class="island-expanded" id="islandExpanded">
    <div class="album">♪</div>
    <div><div style="font-size:11px;opacity:.65">Şimdi Çalıyor</div><div style="font-size:13px;font-weight:700">Müzik</div></div>
    <div class="eq"><i></i><i></i><i></i></div>
  </div>

  <div class="overlay" id="spotlight">
    <div class="spot"><span>⌕</span><input id="searchInput" placeholder="Ara" autocomplete="off"><span id="closeSearch">İptal</span></div>
    <div class="results" id="results"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const apps=[
["Telefon","☎","c-green"],["Mesajlar","●","c-blue"],["Kamera","◉","c-gray"],["Chrome","◍","c-white"],
["ChatGPT","✧","c-white"],["WhatsApp","◉","c-green"],["Spotify","≋","c-green"],["X","𝕏","c-black"],
["Instagram","◎","c-purple"],["YouTube","▶","c-red"],["Netflix","N","c-black"],["TikTok","♪","c-black"],
["Play Store","▷","c-blue"],["Ayarlar","⚙","c-gray"],["Fotoğraflar","✿","c-white"],["Haritalar","⌖","c-blue"],
["Saat","◷","c-black"],["Takvim","28","c-white"],["Notlar","▤","c-orange"],["Dosyalar","▰","c-blue"],
["Hava","☁","c-blue"],["Mail","✉","c-blue"],["Müzik","♪","c-pink"],["Cüzdan","▣","c-black"]
];
function tile(a,mini=false){
  const el=document.createElement("div");el.className="app";el.dataset.name=a[0];
  el.innerHTML='<div class="icon '+a[2]+'"><span class="remove-badge">−</span>'+a[1]+'</div>'+(mini?'':'<div class="label">'+a[0]+'</div>');
  return el;
}
function fill(id,arr){const root=document.getElementById(id);arr.forEach(a=>root.appendChild(tile(a)))}
fill("apps1",apps.slice(4,12)); fill("apps2",apps.slice(12,20));
[apps[0],apps[1],apps[2],apps[3]].forEach(a=>document.getElementById("dock").appendChild(tile(a,true)));

const catData=[
  ["Öneriler",[apps[4],apps[5],apps[6],apps[8]]],
  ["Son Eklenenler",[apps[12],apps[14],apps[19],apps[20]]],
  ["Sosyal",[apps[5],apps[8],apps[7],apps[11]]],
  ["Eğlence",[apps[9],apps[10],apps[6],apps[22]]],
  ["Üretkenlik",[apps[4],apps[18],apps[19],apps[21]]],
  ["Diğer",[apps[13],apps[16],apps[17],apps[23]]]
];
catData.forEach((c,idx)=>{const card=document.createElement("div");card.className="cat";card.dataset.cat=idx;card.innerHTML="<h3>"+c[0]+"</h3><div class='mini'></div>";c[1].forEach(a=>card.querySelector(".mini").appendChild(tile(a,true)));document.getElementById("libGrid").appendChild(card)});
const days=document.getElementById("days");for(let i=1;i<=30;i++){const d=document.createElement("span");d.className="day"+(i===28?" today":"");d.textContent=i;days.appendChild(d)}

let page=0,startX=0,startY=0,dx=0,dy=0,longTimer=null,jiggle=false;
const phone=document.getElementById("phone"),ws=document.getElementById("workspace"),dotEls=[...document.querySelectorAll(".dot")];
function go(n){page=Math.max(0,Math.min(2,n));ws.style.transform="translateX("+(-page*100)+"%)";dotEls.forEach((d,i)=>d.classList.toggle("active",i===page));document.getElementById("searchPill").style.display=page===2?"none":"flex";document.getElementById("dock").style.opacity=page===2?".25":"1"}
phone.addEventListener("pointerdown",e=>{startX=e.clientX;startY=e.clientY;dx=dy=0;longTimer=setTimeout(()=>{jiggle=true;document.getElementById("homePage").classList.add("jiggle");document.getElementById("customZone").classList.add("jiggle-zone");document.getElementById("customizer").classList.add("show");document.getElementById("editTop").classList.add("show");toast("Ana Ekranı Özelleştir")},520)});
phone.addEventListener("pointermove",e=>{dx=e.clientX-startX;dy=e.clientY-startY;if(Math.abs(dx)>8||Math.abs(dy)>8)clearTimeout(longTimer)});
phone.addEventListener("pointerup",()=>{clearTimeout(longTimer);if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)){go(page+(dx<0?1:-1));return}if(dy>80&&Math.abs(dy)>Math.abs(dx)){openSearch()}});

document.getElementById("searchPill").onclick=openSearch;
document.getElementById("closeSearch").onclick=closeSearch;
function openSearch(){document.getElementById("spotlight").classList.add("show");renderResults("");setTimeout(()=>document.getElementById("searchInput").focus(),80)}
function closeSearch(){document.getElementById("spotlight").classList.remove("show");document.getElementById("searchInput").blur()}
document.getElementById("searchInput").oninput=e=>renderResults(e.target.value);
function renderResults(q){const out=document.getElementById("results");out.innerHTML="";apps.filter(a=>a[0].toLowerCase().includes(q.toLowerCase())).slice(0,7).forEach(a=>{const r=document.createElement("div");r.className="result";r.innerHTML='<div class="icon '+a[2]+'">'+a[1]+'</div><div><b>'+a[0]+'</b><div style="font-size:11px;opacity:.6">Uygulama</div></div>';out.appendChild(r)})}

document.addEventListener("click",e=>{
 const m=e.target.closest(".mode"); if(m){document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));m.classList.add("active");phone.classList.remove("clear-mode","tint-mode");if(m.dataset.mode==="clear")phone.classList.add("clear-mode");if(m.dataset.mode==="tint")phone.classList.add("tint-mode");return}
 const app=e.target.closest(".app"); if(app&&!jiggle)toast(app.dataset.name+" açılıyor")
});
function endEdit(){if(!jiggle)return;jiggle=false;document.getElementById("homePage").classList.remove("jiggle");document.getElementById("customZone").classList.remove("jiggle-zone");document.getElementById("customizer").classList.remove("show");document.getElementById("editTop").classList.remove("show");saveLayout();toast("Bitti")}
document.addEventListener("dblclick",endEdit);
document.getElementById("doneEdit").onclick=endEdit;

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)}

document.getElementById("addWidget").onclick=()=>document.getElementById("widgetGallery").classList.add("show");
document.getElementById("closeWidgets").onclick=()=>document.getElementById("widgetGallery").classList.remove("show");
document.getElementById("widgetGallery").addEventListener("click",e=>{if(e.target.id==="widgetGallery")e.currentTarget.classList.remove("show")});

const island=document.querySelector(".island");
island.style.pointerEvents="auto";
island.addEventListener("click",e=>{e.stopPropagation();document.getElementById("islandExpanded").classList.toggle("show")});
document.getElementById("islandExpanded").onclick=e=>e.stopPropagation();

document.querySelectorAll(".cat").forEach(card=>card.addEventListener("click",()=>{
  const c=catData[Number(card.dataset.cat)];
  const fg=document.getElementById("folderGrid");fg.innerHTML="";
  document.getElementById("folderTitle").textContent=c[0];
  c[1].forEach(a=>fg.appendChild(tile(a)));
  document.getElementById("folderOverlay").classList.add("show");
}));
document.getElementById("folderOverlay").addEventListener("click",e=>{if(e.target.id==="folderOverlay")e.currentTarget.classList.remove("show")});

const libInput=document.getElementById("libraryInput");
libInput.addEventListener("pointerdown",e=>e.stopPropagation());
libInput.addEventListener("input",()=>{
  const q=libInput.value.trim().toLowerCase();
  document.querySelectorAll(".cat").forEach(card=>{
    const idx=Number(card.dataset.cat),c=catData[idx];
    card.style.display=(!q||c[0].toLowerCase().includes(q)||c[1].some(a=>a[0].toLowerCase().includes(q)))?"block":"none";
  });
});

let ccStartY=0,ccStartX=0;
phone.addEventListener("pointerdown",e=>{if(e.clientX>phone.clientWidth*.68&&e.clientY<90){ccStartX=e.clientX;ccStartY=e.clientY}});
phone.addEventListener("pointerup",e=>{
  if(ccStartY&&e.clientY-ccStartY>55){document.getElementById("controlCenter").classList.add("show")}
  ccStartY=ccStartX=0;
});
document.addEventListener("click",e=>{
  const cc=document.getElementById("controlCenter");
  if(cc.classList.contains("show")&&!e.target.closest("#controlCenter"))cc.classList.remove("show");
  const ie=document.getElementById("islandExpanded");
  if(ie.classList.contains("show")&&!e.target.closest(".island")&&!e.target.closest("#islandExpanded"))ie.classList.remove("show");
});

phone.addEventListener("pointermove",e=>{
  const p=e.clientX/Math.max(1,phone.clientWidth);
  document.documentElement.style.setProperty("--sheen-x",(-30+p*60)+"%");
});


const appByName=Object.fromEntries(apps.map(a=>[a[0],a]));
function widgetMarkup(type){
  if(type==="weather")return '<button class="remove-widget">−</button><div style="font-size:11px;font-weight:700;opacity:.72">Onikişubat</div><div style="font-size:38px;font-weight:300;margin-top:9px">20°</div><div style="font-size:11px">Bulutlu · Y:25° D:17°</div>';
  if(type==="battery")return '<button class="remove-widget">−</button><div style="font-size:11px;font-weight:700;opacity:.72">Pil</div><div style="font-size:38px;font-weight:300;margin-top:16px">75%</div><div style="font-size:11px;opacity:.62">6 sa 20 dk</div>';
  if(type==="calendar")return '<button class="remove-widget">−</button><div style="font-size:11px;font-weight:700;opacity:.72">EYLÜL</div><div style="font-size:42px;font-weight:750;margin-top:12px">28</div><div style="font-size:11px;opacity:.62">Pazartesi</div>';
  if(type==="photo")return '<button class="remove-widget">−</button><div style="position:absolute;inset:0;background:linear-gradient(145deg,rgba(114,86,255,.9),rgba(255,117,98,.76));display:grid;place-items:center;font-size:38px">✦</div>';
  return '<button class="remove-widget">−</button><div style="font-size:11px;opacity:.65">Şimdi Çalıyor</div><div style="font-size:22px;font-weight:700;margin-top:14px">♪ Müzik</div><div style="font-size:11px;opacity:.62;margin-top:5px">Duraklatıldı</div>';
}
function addCustomWidget(type,save=true){
  const zone=document.getElementById("customZone");
  const w=document.createElement("div");w.className="custom-widget"+(type==="music"?" wide":"");w.dataset.widget=type;w.innerHTML=widgetMarkup(type);
  w.querySelector(".remove-widget").onclick=e=>{e.stopPropagation();w.remove();saveLayout()};
  zone.appendChild(w);
  if(save)saveLayout();
}
document.querySelectorAll(".wopt").forEach(b=>b.addEventListener("click",()=>{
  addCustomWidget(b.dataset.widget,true);
  document.getElementById("widgetGallery").classList.remove("show");
  go(1);toast("Widget eklendi");
}));

function saveLayout(){
  const data={
    a1:[...document.querySelectorAll("#apps1>.app")].map(x=>x.dataset.name),
    a2:[...document.querySelectorAll("#apps2>.app")].map(x=>x.dataset.name),
    widgets:[...document.querySelectorAll("#customZone>.custom-widget")].map(x=>x.dataset.widget),
    mode:phone.classList.contains("clear-mode")?"clear":phone.classList.contains("tint-mode")?"tint":"normal"
  };
  try{localStorage.setItem("glassHomeLayoutV3",JSON.stringify(data))}catch(e){}
  const chip=document.getElementById("saveChip");chip.classList.add("show");setTimeout(()=>chip.classList.remove("show"),800)
}
function restoreLayout(){
  let d=null;try{d=JSON.parse(localStorage.getItem("glassHomeLayoutV3")||"null")}catch(e){}
  if(!d)return;
  [["apps1",d.a1],["apps2",d.a2]].forEach(([id,names])=>{
    if(!Array.isArray(names))return;
    const root=document.getElementById(id),current=[...root.children],map=Object.fromEntries(current.map(x=>[x.dataset.name,x]));
    names.forEach(n=>{if(map[n])root.appendChild(map[n])});
  });
  if(Array.isArray(d.widgets))d.widgets.forEach(t=>addCustomWidget(t,false));
  if(d.mode==="clear")phone.classList.add("clear-mode");
  if(d.mode==="tint")phone.classList.add("tint-mode");
  document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x.dataset.mode===(d.mode||"normal")));
}
restoreLayout();

document.querySelectorAll(".mode").forEach(m=>m.addEventListener("click",()=>setTimeout(saveLayout,0)));

let dragged=null,ghost=null,dragGrid=null;
function beginAppDrag(app,e,grid){
  dragged=app;dragGrid=grid;app.classList.add("dragging-app");grid.classList.add("drag-active");
  ghost=app.cloneNode(true);ghost.classList.add("drag-ghost");ghost.classList.remove("dragging-app");document.body.appendChild(ghost);
  moveGhost(e.clientX,e.clientY);
  app.setPointerCapture?.(e.pointerId);
}
function moveGhost(x,y){if(ghost){ghost.style.left=x+"px";ghost.style.top=y+"px"}}
function finishAppDrag(){
  if(!dragged)return;
  dragged.classList.remove("dragging-app");dragGrid?.classList.remove("drag-active");ghost?.remove();
  dragged=ghost=dragGrid=null;saveLayout()
}
["apps1","apps2"].forEach(id=>{
  const grid=document.getElementById(id);
  grid.addEventListener("pointerdown",e=>{
    if(!jiggle)return;
    const app=e.target.closest(".app");if(!app)return;
    e.stopPropagation();e.preventDefault();beginAppDrag(app,e,grid)
  });
  grid.addEventListener("pointermove",e=>{
    if(!dragged||dragGrid!==grid)return;
    e.stopPropagation();e.preventDefault();moveGhost(e.clientX,e.clientY);
    const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest(".app");
    if(hit&&hit!==dragged&&hit.parentElement===grid){
      const r=hit.getBoundingClientRect();
      const after=(e.clientY>r.top+r.height/2)||(Math.abs(e.clientY-(r.top+r.height/2))<r.height*.25&&e.clientX>r.left+r.width/2);
      grid.insertBefore(dragged,after?hit.nextSibling:hit)
    }
  });
  grid.addEventListener("pointerup",e=>{if(dragged){e.stopPropagation();finishAppDrag()}});
  grid.addEventListener("pointercancel",finishAppDrag);
});

document.addEventListener("click",e=>{
  const minus=e.target.closest(".remove-badge");
  if(minus&&jiggle){
    e.stopImmediatePropagation();
    const app=minus.closest(".app");
    if(app&&app.parentElement?.classList.contains("apps")){app.remove();saveLayout();toast("Ana ekrandan kaldırıldı")}
  }
},true);

setInterval(()=>{const d=new Date();document.getElementById("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")},1000);
</script>
</body>
</html>
