name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip'
      - 'JARVIS_v1.5.7_STABLE_VOICE_READY.apk'
      - 'patches/1.7.0/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Verify production baseline
        run: |
          test -f JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip
          test -f JARVIS_v1.5.7_STABLE_VOICE_READY.apk
          keytool -printcert -jarfile JARVIS_v1.5.7_STABLE_VOICE_READY.apk > base-cert.txt
          grep -q "F2:4F:05:32:8D:0D:A5:5A:60:53:BD:31:22:17:40:86:42:5E:A7:3B:EC:91:76:92:2E:13:44:CD:B1:E8:30:8A" base-cert.txt

      - name: Unpack 1.6.4.17 source
        run: |
          rm -rf work
          mkdir -p work/src
          unzip -q JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip -d work/src
          PROJECT_DIR="$(find work/src -maxdepth 3 -type f -name settings.gradle -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          grep -q "applicationId 'com.hakan.jarvis'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionCode 82" "$PROJECT_DIR/app/build.gradle"

      - name: Apply JARVIS 1.7.0 wake-word patch
        run: |
          cp patches/1.7.0/app/src/main/java/com/hakan/jarvis/*.java "$PROJECT_DIR/app/src/main/java/com/hakan/jarvis/"
          python patches/1.7.0/apply_patch.py "$PROJECT_DIR"
          grep -q "versionCode 83" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.7.0-wakeword1'" "$PROJECT_DIR/app/build.gradle"
          grep -q 'android:versionCode="83"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'WakeWordService' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Wake signal regression
        run: |
          mkdir -p work/wake-test
          javac -source 8 -target 8 -Xlint:none -d work/wake-test             "$PROJECT_DIR/app/src/main/java/com/hakan/jarvis/WakeSignal.java"             patches/1.7.0/qa/WakeSignalTest.java
          java -cp work/wake-test WakeSignalTest

      - name: Prepare compile-only MainActivity stub
        run: |
          mkdir -p work/stub/com/hakan/jarvis
          cat > work/stub/com/hakan/jarvis/MainActivity.java <<'JAVA'
          package com.hakan.jarvis;
          public class MainActivity extends android.app.Activity implements android.view.View.OnClickListener {
              protected void updateHybridStatus(){}
              protected boolean isOnline(){return false;}
              public void onClick(android.view.View v){}
          }
          JAVA

      - name: Compile Java against Android API 35
        run: |
          mkdir -p work/classes
          LIBCP="$PROJECT_DIR/app/libs/okhttp-3.12.13.jar:$PROJECT_DIR/app/libs/okio-1.17.5.jar"
          find "$PROJECT_DIR/app/src/main/java" -type f -name '*.java' | sort > work/sources.txt
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:none             -cp "$ANDROID_JAR:$LIBCP"             -d work/classes             work/stub/com/hakan/jarvis/MainActivity.java             @work/sources.txt
          test -f work/classes/com/hakan/jarvis/HybridActivity.class
          test -f work/classes/com/hakan/jarvis/WakeWordService.class
          test -f work/classes/com/hakan/jarvis/WakeWordEnrollment.class
          test -f work/classes/com/hakan/jarvis/WakeSignal.class
          rm work/classes/com/hakan/jarvis/MainActivity.class
          if find work/classes -type f -name 'MainActivity*.class' | grep -q .; then
            echo "Compile stub leaked into output"
            exit 1
          fi

      - name: Extract exact 1.5.7 legacy engine DEX
        run: |
          unzip -p JARVIS_v1.5.7_STABLE_VOICE_READY.apk classes.dex > work/baseline.dex
          test -s work/baseline.dex

      - name: D8 merge legacy engine and 1.7.0 classes
        run: |
          mkdir -p work/dex
          mapfile -t CLASS_FILES < <(find work/classes -type f -name '*.class' | sort)
          "$BT/d8" --release --min-api 23 --lib "$ANDROID_JAR"             --output work/dex             work/baseline.dex             "${CLASS_FILES[@]}"             "$PROJECT_DIR/app/libs/okhttp-3.12.13.jar"             "$PROJECT_DIR/app/libs/okio-1.17.5.jar"
          test -s work/dex/classes.dex
          COUNT="$(find work/dex -maxdepth 1 -type f -name '*.dex' | wc -l)"
          test "$COUNT" -eq 1
          grep -a -q 'WakeWordService' work/dex/classes.dex
          grep -a -q 'WakeWordEnrollment' work/dex/classes.dex
          grep -a -q 'WakeSignal' work/dex/classes.dex
          grep -a -q 'CommandChain' work/dex/classes.dex

      - name: Package JARVIS 1.7.0 APK
        run: |
          cp "$PROJECT_DIR/app/src/main/AndroidManifest.xml" work/AndroidManifest.xml
          "$BT/aapt" package -f             -M work/AndroidManifest.xml             -I "$ANDROID_JAR"             -A "$PROJECT_DIR/app/src/main/assets"             -F work/unsigned.apk
          (cd work/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 work/unsigned.apk work/JARVIS_1.7.0_UNSIGNED.apk
          "$BT/zipalign" -c 4 work/JARVIS_1.7.0_UNSIGNED.apk
          "$BT/aapt" dump badging work/JARVIS_1.7.0_UNSIGNED.apk > work/badging.txt
          "$BT/aapt" dump xmltree work/JARVIS_1.7.0_UNSIGNED.apk AndroidManifest.xml > work/manifest-tree.txt
          grep -q "package: name='com.hakan.jarvis' versionCode='83' versionName='1.7.0-wakeword1'" work/badging.txt
          grep -q "launchable-activity: name='com.hakan.jarvis.HybridActivity'" work/badging.txt
          grep -q 'WakeWordService' work/manifest-tree.txt
          grep -q 'WakeWordBootReceiver' work/manifest-tree.txt
          unzip -t work/JARVIS_1.7.0_UNSIGNED.apk
          unzip -l work/JARVIS_1.7.0_UNSIGNED.apk | grep -q 'classes.dex'
          if unzip -l work/JARVIS_1.7.0_UNSIGNED.apk | grep -q 'classes2.dex'; then
            echo "Unexpected multidex output"
            exit 1
          fi

      - name: Collect unsigned APK and signing tool
        run: |
          mkdir -p artifact
          cp work/JARVIS_1.7.0_UNSIGNED.apk artifact/
          cp "$BT/lib/apksigner.jar" artifact/apksigner.jar
          cp work/badging.txt artifact/
          cp work/manifest-tree.txt artifact/
          cp base-cert.txt artifact/base-cert.txt
          sha256sum artifact/JARVIS_1.7.0_UNSIGNED.apk > artifact/SHA256.txt

      - name: Upload 1.7.0 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-1.7.0-wakeword-build
          path: artifact/
          if-no-files-found: error
