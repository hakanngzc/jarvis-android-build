name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack JARVIS source
        run: |
          test -f JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip -d buildsrc
          PROJECT_DIR="$(find buildsrc -maxdepth 3 -type f -name settings.gradle -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify target metadata
        run: |
          grep -q "applicationId 'com.hakan.jarvis'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionCode 82" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.6.4.17-context-chain-src1'" "$PROJECT_DIR/app/build.gradle"
          grep -q "compileSdk 35" "$PROJECT_DIR/app/build.gradle"

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" artifact/JARVIS_1.6.4.17_UNSIGNED.apk
          sha256sum artifact/JARVIS_1.6.4.17_UNSIGNED.apk > artifact/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-1.6.4.17-unsigned
          path: artifact/
          if-no-files-found: error
