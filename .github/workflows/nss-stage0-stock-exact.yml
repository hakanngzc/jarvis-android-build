name: NSS Stage0 Stock Exact Foundation

on:
  push:
    branches:
      - stage0-foundation-public-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Android Build Tools
        run: |
          set -euo pipefail
          VERSION=35.0.0
          if [ ! -x "$ANDROID_HOME/build-tools/$VERSION/apksigner" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$VERSION" >/dev/null
          fi
          "$ANDROID_HOME/build-tools/$VERSION/apksigner" version
          "$ANDROID_HOME/build-tools/$VERSION/aapt" version

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot original signed NSS 4.31 without any patch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: bash stage0_stock_exact_gate.sh

      - name: Upload Stage0 canonical and stock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-foundation-evidence
          path: ${{ runner.temp }}/stage0-foundation/
          retention-days: 2
