name: NSS Stage3 Minimal

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  stage3-full:
    if: github.head_ref == 'tmp-uptodown-source-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 10 and isolate MainMenu to SaveSlot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            python3 stage3_runtime_hotfix.py
            python3 - <<'PY'
            from pathlib import Path
            p = Path('stage3_minimal_gate.sh')
            s = p.read_text(encoding='utf-8')
            anchor = '''# Fresh stock Career creation.\nstart_game fresh\nopen_slot0 fresh\nwait_log 'Create Screen:[[:space:]]*chooseclub|SETTING ACTIVE:[[:space:]]*chooseclub|SetActive:[[:space:]]*chooseclub' 30 chooseclub'''
            replacement = '''# Fresh stock Career creation.\nstart_game fresh\nopen_slot0 fresh\ncapture_log 'ui-entry probe after slot0 tap'\nshot ui-entry-after-slot0\necho 'STAGE3_UI_ENTRY_PROBE=PASS'\nexit 0\nwait_log 'Create Screen:[[:space:]]*chooseclub|SETTING ACTIVE:[[:space:]]*chooseclub|SetActive:[[:space:]]*chooseclub' 30 chooseclub'''
            if anchor not in s:
                raise SystemExit('UI-entry probe anchor not found')
            p.write_text(s.replace(anchor, replacement, 1), encoding='utf-8')
            PY
            bash -n stage3_minimal_gate.sh
            bash stage3_minimal_gate.sh
      - name: Upload Stage3 UI-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-ui-entry-evidence
          path: ${{ runner.temp }}/stage3-minimal/
          retention-days: 1
