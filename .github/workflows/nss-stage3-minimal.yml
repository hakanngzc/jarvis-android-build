name: NSS Stage3 Minimal

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  stage3-full:
    if: github.head_ref == 'tmp-uptodown-source-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 10 default AOSP and run full Stage3 gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            sed -i 's|sign_one(){ local src="$1" dst="$2" tmp="$WORK/aligned-$(basename "$dst")";|sign_one(){ local src="$1" dst="$2"; local tmp="$WORK/aligned-$(basename "$dst")";|' stage3_minimal_gate.sh
            bash -n stage3_minimal_gate.sh
            bash stage3_minimal_gate.sh
      - name: Upload Stage3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-minimal-evidence
          path: ${{ runner.temp }}/stage3-minimal/
          retention-days: 1
