name: NSS Stage3 Minimal

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  stage3-full:
    if: github.head_ref == 'tmp-uptodown-source-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Stage3 fast-match full-time regression
        run: python3 -m unittest test_stage3_fast_match_fulltime.py -v
      - name: Stage3 reload auto-load regression
        run: python3 -m unittest test_stage3_reload_autoload.py -v
      - name: Stage3 weekly-review state regression
        run: |
          python3 stage3_runtime_hotfix.py
          python3 -m unittest test_stage3_weeklyreview_state.py -v
      - name: Stage3 AdMob overlay regression
        run: |
          python3 -m unittest test_stage3_ad_overlay_flow.py -v
          python3 stage3_runtime_hotfix.py
          python3 stage3_ad_overlay_state_patch.py
          python3 -m unittest test_stage3_ad_overlay_state.py -v
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 10 and verify full Stage3 lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            python3 stage3_runtime_hotfix.py
            python3 stage3_ad_overlay_state_patch.py
            python3 stage3_career_input_retry_patch.py
            python3 stage3_readiness_patch.py
            python3 stage3_match_flow_patch.py
            python3 stage3_match_button_target_patch.py
            python3 stage3_reload_autoload_patch.py
            bash -n stage3_minimal_gate.sh
            bash stage3_minimal_gate.sh
      - name: Upload Stage3 full lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-full-lifecycle-evidence
          path: ${{ runner.temp }}/stage3-minimal/
          retention-days: 1
