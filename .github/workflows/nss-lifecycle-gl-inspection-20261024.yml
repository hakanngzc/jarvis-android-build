name: NSS Lifecycle GL Inspection 20261024

on:
  workflow_dispatch:
  push:
    branches:
      - nss-residual-static-20261024
    paths:
      - '.github/workflows/nss-lifecycle-gl-inspection-20261024.yml'
      - 'lifecycle/dump_graphics_lifecycle_code.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch verified stock NSS 4.31 and inspect GL lifecycle
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nss-lifecycle-gl"; mkdir -p "$WORK/out"
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' \
            -e 'https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31' \
            'https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137' -o "$WORK/stock.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$WORK/stock.xapk" | sha256sum -c -
          unzip -p "$WORK/stock.xapk" com.newstargames.newstarsoccer.apk > "$WORK/base.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$WORK/base.apk" | sha256sum -c -
          python3 lifecycle/dump_graphics_lifecycle_code.py "$WORK/base.apk" --out "$WORK/out/GRAPHICS_LIFECYCLE_CODE.json" \
            | tee "$WORK/out/GRAPHICS_LIFECYCLE_CODE.txt"
      - name: Upload inspection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-lifecycle-gl-inspection-20261024
          path: ${{ runner.temp }}/nss-lifecycle-gl/out/
          retention-days: 30
