name: NSS Stage6 Badge Override Unit
on:
  workflow_dispatch:
  push:
    branches:
      - stage6-badge-atlas-discovery-20261023
      - stage6-production-rollout-20261024
    paths:
      - 'stage6_public/**'
      - '.github/workflows/nss-stage6-badge-override-unit.yml'
permissions:
  contents: read
jobs:
  badge-override-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Stage6 unit contracts
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          PYTHONPATH=stage6_public python3 -m unittest discover -s stage6_public -p 'test_*.py' -v
