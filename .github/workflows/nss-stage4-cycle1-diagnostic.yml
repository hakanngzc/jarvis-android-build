name: NSS Stage4 Cycle1 Ratings Diagnostic

on:
  push:
    branches: [stage4-cycle1-diagnostic-20261027]

permissions:
  contents: read

jobs:
  stage4-cycle1-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate cycle1 diagnostic tooling
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py
          python3 -m unittest test_stage4_natural_policy.py test_stage4_event_navigation.py test_stage4_single_decode_classifier.py test_stage4_boundary_scope.py -v
          bash -n stage4_natural_season_gate.sh stage4_tools/run_stage4_natural_gate.sh stage4_tools/run_stage4_cycle1_diagnostic.sh

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Run one natural match and verify postmatch return
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MIN_PROGRESS_DAYS: '0'
          MIN_MATCH_CYCLES: '1'
          MIN_WALL_SECONDS: '0'
          MAX_MATCH_CYCLES: '1'
          MATCH_TIMEOUT_SECONDS: '900'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-cycle1.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-cycle1.pre.sh" "$RUNNER_TEMP/stage4-cycle1.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-cycle1.start.sh" "$RUNNER_TEMP/stage4-cycle1.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-cycle1.visual.sh" "$RUNNER_TEMP/stage4-cycle1.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-cycle1.offline.sh" "$RUNNER_TEMP/stage4-cycle1.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-cycle1.shortleague.sh" "$RUNNER_TEMP/stage4-cycle1.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-cycle1.events.sh" "$RUNNER_TEMP/stage4-cycle1.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-cycle1.prematch.sh" "$RUNNER_TEMP/stage4-cycle1.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-cycle1.live.sh" "$RUNNER_TEMP/stage4-cycle1.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-cycle1.speed.sh" "$RUNNER_TEMP/stage4-cycle1.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-cycle1.boundary.sh" "$RUNNER_TEMP/stage4-cycle1.final.sh"
            bash -n "$RUNNER_TEMP/stage4-cycle1.final.sh"
            bash stage4_tools/run_stage4_cycle1_diagnostic.sh "$RUNNER_TEMP/stage4-cycle1.final.sh"

      - name: Upload cycle1 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-cycle1-ratings-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
