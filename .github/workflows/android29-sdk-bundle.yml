name: Android 29 SDK Bundle
on:
  push:
    branches:
      - nss-runner-probe-20261019
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Install Android 29 emulator image
        run: |
          set -euxo pipefail
          ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ROOT" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-29;google_apis;x86_64'
      - name: Package and split minimal software-emulator SDK
        run: |
          set -euxo pipefail
          ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$BT"
          mkdir -p /tmp/android-sdk-lite/system-images/android-29/google_apis /tmp/android-sdk-lite/build-tools
          cp -a "$ROOT/emulator" /tmp/android-sdk-lite/
          cp -a "$ROOT/platform-tools" /tmp/android-sdk-lite/
          cp -a "$ROOT/system-images/android-29/google_apis/x86_64" /tmp/android-sdk-lite/system-images/android-29/google_apis/
          cp -a "$BT" /tmp/android-sdk-lite/build-tools/
          tar -C /tmp -I 'zstd -T0 -10' -cf android29-softemu.tar.zst android-sdk-lite
          sha256sum android29-softemu.tar.zst > android29-softemu.tar.zst.sha256
          split -b 450M -d -a 2 android29-softemu.tar.zst android29-softemu.part-
          ls -lh android29-softemu.part-* android29-softemu.tar.zst.sha256
          test -f android29-softemu.part-00
          test -f android29-softemu.part-01
          test -f android29-softemu.part-02
          test -f android29-softemu.part-03
      - name: Upload SDK part 00
        uses: actions/upload-artifact@v4
        with:
          name: android29-softemu-part-00
          path: |
            android29-softemu.part-00
            android29-softemu.tar.zst.sha256
          compression-level: 0
      - name: Upload SDK part 01
        uses: actions/upload-artifact@v4
        with:
          name: android29-softemu-part-01
          path: android29-softemu.part-01
          compression-level: 0
      - name: Upload SDK part 02
        uses: actions/upload-artifact@v4
        with:
          name: android29-softemu-part-02
          path: android29-softemu.part-02
          compression-level: 0
      - name: Upload SDK part 03
        uses: actions/upload-artifact@v4
        with:
          name: android29-softemu-part-03
          path: android29-softemu.part-03
          compression-level: 0
