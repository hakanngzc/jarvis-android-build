name: Build BlockWorld APK
on:
  push:
    branches: [ blockworld-game ]
    paths:
      - 'blockworld/**'
      - '.github/workflows/blockworld-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned release APK
        working-directory: blockworld
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blockworld-v0.1-unsigned
          path: blockworld/app/build/outputs/apk/release/app-release-unsigned.apk
