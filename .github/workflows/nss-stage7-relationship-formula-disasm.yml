name: NSS Stage7 Relationship Formula Disassembly
on:
  workflow_dispatch:
  push:
    branches: [stage7-relationship-lifestyle-disasm-20261029]
    paths:
      - '.github/workflows/nss-stage7-relationship-formula-disasm.yml'
permissions:
  contents: read
jobs:
  disasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage7-rel/xapk" stage7_formula_artifacts
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage7-rel/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage7-rel/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage7-rel/nss431.xapk" -d "$RUNNER_TEMP/stage7-rel/xapk"
          BASE="$RUNNER_TEMP/stage7-rel/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          unzip -q "$BASE" 'classes*.dex' -d "$RUNNER_TEMP/stage7-rel/dex"
          mkdir -p stage7_formula_artifacts/source_apk
          unzip -q "$BASE" \
            'assets/monkey/Tweaks/TweakValues.txt' \
            'assets/monkey/NewGUI/Screens/*.uis' \
            'assets/monkey/NewGUI/Screens/*.uih' \
            -d stage7_formula_artifacts/source_apk
          sha256sum stage7_formula_artifacts/source_apk/assets/monkey/Tweaks/TweakValues.txt > stage7_formula_artifacts/tweak-values-sha256.txt
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Download pinned baksmali
        run: |
          set -euo pipefail
          BAK="$RUNNER_TEMP/stage7-rel/baksmali-3.0.10-fat.jar"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar' -o "$BAK"
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  '"$BAK" | sha256sum -c -
          echo "BAK=$BAK" >> "$GITHUB_ENV"
      - name: Disassemble all application DEX payloads
        run: |
          set -euo pipefail
          mkdir -p stage7_formula_artifacts/smali
          for dex in "$RUNNER_TEMP"/stage7-rel/dex/classes*.dex; do
            name="$(basename "$dex" .dex)"
            java -jar "$BAK" d --api 29 "$dex" -o "stage7_formula_artifacts/smali/$name"
            sha256sum "$dex" >> stage7_formula_artifacts/dex-sha256.txt
          done
          java -jar "$BAK" --version > stage7_formula_artifacts/baksmali-version.txt
      - name: Build relationship and lifestyle reference index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('stage7_formula_artifacts/smali')
          fields=[
            'm_relationboss','m_relationbossint','m_relationfans','m_relationfansint','m_relationfriends',
            'm_relationgirlfriend','m_relationsponsors','m_relationteam','m_relationteamint','m_girlfriendcount'
          ]
          strings=['Lifestyle','Lifestyle_Before','Lifestyle_Displayed','m_lastspendtimefriends','m_lastspendtimegirlfriend']
          effective=['p_GetEffectiveRelationBoss','p_GetEffectiveRelationBossInt','p_GetEffectiveRelationFans','p_GetEffectiveRelationFansInt','p_GetEffectiveRelationTeam','p_GetEffectiveRelationTeamInt','p_GetEffectiveRelationSponsors']
          hits=[]; files=set()
          needles=fields+strings+effective
          for p in sorted(root.rglob('*.smali')):
            text=p.read_text(encoding='utf-8',errors='replace')
            if not any(x in text for x in needles): continue
            rel=str(p.relative_to(root)); files.add(rel)
            for i,line in enumerate(text.splitlines(),1):
              if any(x in line for x in needles):
                hits.append({'file':rel,'line':i,'text':line.strip()})
          out={'schema':2,'fields':fields,'lifestyle_variables':['Lifestyle','Lifestyle_Before','Lifestyle_Displayed'],'effective_readers':effective,'matching_files':sorted(files),'hit_count':len(hits),'hits':hits}
          Path('stage7_formula_artifacts/reference-index.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('matching_files',len(files),'hits',len(hits))
          if not files or len(hits)<20: raise SystemExit('reference scan unexpectedly small')
          PY
      - name: Record artifact manifest
        run: |
          set -euo pipefail
          (cd stage7_formula_artifacts && find . -type f ! -name member-sha256.txt -print0 | sort -z | xargs -0 sha256sum) > stage7_formula_artifacts/member-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          idx=json.loads(Path('stage7_formula_artifacts/reference-index.json').read_text())
          tweak=Path('stage7_formula_artifacts/source_apk/assets/monkey/Tweaks/TweakValues.txt')
          m={'verdict':'STAGE7_RELATIONSHIP_FORMULA_DISASM_PASS','matching_files':len(idx['matching_files']),'hit_count':idx['hit_count'],'source_xapk_sha256':'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e','source_base_apk_sha256':'46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4','tweak_values_sha256':hashlib.sha256(tweak.read_bytes()).hexdigest()}
          Path('stage7_formula_artifacts/manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print(m['verdict'])
          PY
      - name: Upload Stage7 relationship formula disassembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage7-relationship-formula-disasm
          path: stage7_formula_artifacts/**
