name: Wake Word Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wake-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract wake sample
        run: |
          rm -rf diag && mkdir -p diag
          unzip -q JARVIS_1.6.4.17_CONTEXT_CHAIN_SOURCE_READY.zip -d diag/src
          cp "$(find diag/src -type f -name jarvis_wake_cp3.wav | head -n1)" diag/jarvis.wav
          file diag/jarvis.wav
      - name: Cache Turkish Vosk model
        uses: actions/cache@v4
        with:
          path: diag/model
          key: vosk-tr-small-0.3
      - name: Download Turkish model
        run: |
          if [ ! -d diag/model ]; then
            wget -q --show-progress https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip -O diag/model.zip
            unzip -q diag/model.zip -d diag
            mv diag/vosk-model-small-tr-0.3 diag/model
          fi
      - name: Recognize wake sample
        run: |
          python -m pip install -q vosk
          python - <<'PY'
          import wave, json
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(-1)
          wf=wave.open('diag/jarvis.wav','rb')
          print('WAV',wf.getframerate(),wf.getnchannels(),wf.getsampwidth(),wf.getnframes())
          model=Model('diag/model')
          for grammar in [None, '["servis","jarvis","carvis","cervis","jervis","jarviz","carviz","[unk]"]']:
              rec=KaldiRecognizer(model,wf.getframerate()) if grammar is None else KaldiRecognizer(model,wf.getframerate(),grammar)
              wf.rewind()
              chunks=[]
              while True:
                  data=wf.readframes(4000)
                  if not data: break
                  if rec.AcceptWaveform(data):
                      chunks.append(json.loads(rec.Result()).get('text',''))
              final=json.loads(rec.FinalResult()).get('text','')
              print('GRAMMAR',grammar)
              print('RESULT',' '.join([x for x in chunks+[final] if x]))
          PY
