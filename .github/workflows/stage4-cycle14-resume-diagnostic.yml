name: Stage4 Cycle14 Resume Diagnostic

on:
  push:
    branches: [stage4-cycle14-resume-diagnostic-20261027]

permissions:
  contents: read
  actions: read

jobs:
  cycle14-resume-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fetch real natural cycle14 save from run290
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage4-seed"
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/hakanngzc/jarvis-android-build/actions/artifacts/12688767088/zip" \
            -o "$RUNNER_TEMP/stage4-seed/run290.zip"
          unzip -p "$RUNNER_TEMP/stage4-seed/run290.zip" cycle-14-MonkeyGame.xml > "$RUNNER_TEMP/stage4-seed/cycle-14-MonkeyGame.xml"
          test -s "$RUNNER_TEMP/stage4-seed/cycle-14-MonkeyGame.xml"
          grep -q monkeystate "$RUNNER_TEMP/stage4-seed/cycle-14-MonkeyGame.xml"
          sha256sum "$RUNNER_TEMP/stage4-seed/cycle-14-MonkeyGame.xml" | tee "$RUNNER_TEMP/stage4-seed/seed-sha256.txt"

      - name: Validate diagnostic tooling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            stage2_residual_tools/prepare_stage2_gate.py \
            stage2_residual_tools/prepare_runtime_start_retry.py \
            stage2_residual_tools/prepare_chooseclub_visual.py \
            stage4_tools/prepare_stage4_offline_runtime.py \
            stage4_tools/prepare_stage4_short_league.py \
            stage4_tools/prepare_stage4_event_navigation.py \
            stage4_tools/prepare_stage4_prematch.py \
            stage4_tools/prepare_stage4_live_input.py \
            stage4_tools/prepare_stage4_match_speed.py \
            stage4_tools/prepare_stage4_boundary_scope.py \
            stage4_tools/prepare_stage4_match_resolution.py \
            stage4_tools/prepare_stage4_cycle14_resume_diagnostic.py \
            stage4_tools/verify_stage4_natural_season.py
          bash -n stage4_natural_season_gate.sh

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 10 and resume natural season from real cycle14 save
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          STAGE4_DIAGNOSTIC_SEED_XML: ${{ runner.temp }}/stage4-seed/cycle-14-MonkeyGame.xml
          MIN_PROGRESS_DAYS: '0'
          MIN_MATCH_CYCLES: '1'
          MIN_WALL_SECONDS: '0'
          MAX_MATCH_CYCLES: '25'
          MATCH_TIMEOUT_SECONDS: '900'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-diag.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-diag.pre.sh" "$RUNNER_TEMP/stage4-diag.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-diag.start.sh" "$RUNNER_TEMP/stage4-diag.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-diag.visual.sh" "$RUNNER_TEMP/stage4-diag.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-diag.offline.sh" "$RUNNER_TEMP/stage4-diag.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-diag.shortleague.sh" "$RUNNER_TEMP/stage4-diag.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-diag.events.sh" "$RUNNER_TEMP/stage4-diag.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-diag.prematch.sh" "$RUNNER_TEMP/stage4-diag.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-diag.live.sh" "$RUNNER_TEMP/stage4-diag.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-diag.speed.sh" "$RUNNER_TEMP/stage4-diag.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-diag.boundary.sh" "$RUNNER_TEMP/stage4-diag.resolution.sh"
            python3 stage4_tools/prepare_stage4_cycle14_resume_diagnostic.py "$RUNNER_TEMP/stage4-diag.resolution.sh" "$RUNNER_TEMP/stage4-diag.final.sh"
            bash -n "$RUNNER_TEMP/stage4-diag.final.sh"
            bash "$RUNNER_TEMP/stage4-diag.final.sh"

      - name: Upload cycle14 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-cycle14-diagnostic-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
