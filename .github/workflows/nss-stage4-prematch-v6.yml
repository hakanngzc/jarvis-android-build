name: NSS Stage4 Prematch Natural Season

on:
  push:
    branches: [nss-stage4-prematch-fix-20261024-v6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage4-natural-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate natural-season tooling
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_prematch.py stage4_tools/verify_stage4_natural_season.py
          bash -n stage4_natural_season_gate.sh
          python3 -m unittest test_stage4_natural_policy.py test_stage2_residual_contract.py -v

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 10 and run a natural full season
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MIN_PROGRESS_DAYS: '90'
          MIN_MATCH_CYCLES: '12'
          MIN_WALL_SECONDS: '1200'
          MAX_MATCH_CYCLES: '60'
          MATCH_TIMEOUT_SECONDS: '360'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-natural-gate.pre.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-natural-gate.pre.sh" "$RUNNER_TEMP/stage4-natural-gate.visual.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-natural-gate.visual.sh" "$RUNNER_TEMP/stage4-natural-gate.sh"
            bash -n "$RUNNER_TEMP/stage4-natural-gate.sh"
            bash "$RUNNER_TEMP/stage4-natural-gate.sh"

      - name: Upload Stage4 natural-season evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-natural-season-evidence
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
