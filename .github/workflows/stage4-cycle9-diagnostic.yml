name: Stage4 Cycle9 Diagnostic

on:
  push:
    branches: [stage4-cycle9-diagnostic-20261026]

permissions:
  contents: read
  actions: read

jobs:
  cycle9-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAX_MATCH_CYCLES: '20'
      MATCH_TIMEOUT_SECONDS: '900'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download proven natural cycle9 seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stage4-diagnostic-seed"
          gh api repos/hakanngzc/jarvis-android-build/actions/artifacts/12664350778/zip > "$RUNNER_TEMP/stage4-diagnostic-seed/run275.zip"
          unzip -q "$RUNNER_TEMP/stage4-diagnostic-seed/run275.zip" -d "$RUNNER_TEMP/stage4-diagnostic-seed/run275"
          test -s "$RUNNER_TEMP/stage4-diagnostic-seed/run275/cycle-9-MonkeyGame.xml"

      - name: Validate diagnostic composition
        run: |
          python3 -m py_compile stage4_tools/prepare_stage4_cycle9_diagnostic.py
          python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/diag.pre.sh"
          python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/diag.pre.sh" "$RUNNER_TEMP/diag.start.sh"
          python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/diag.start.sh" "$RUNNER_TEMP/diag.visual.sh"
          python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/diag.visual.sh" "$RUNNER_TEMP/diag.offline.sh"
          python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/diag.offline.sh" "$RUNNER_TEMP/diag.short.sh"
          python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/diag.short.sh" "$RUNNER_TEMP/diag.events.sh"
          python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/diag.events.sh" "$RUNNER_TEMP/diag.prematch.sh"
          python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/diag.prematch.sh" "$RUNNER_TEMP/diag.live.sh"
          python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/diag.live.sh" "$RUNNER_TEMP/diag.speed.sh"
          python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/diag.speed.sh" "$RUNNER_TEMP/diag.boundary.sh"
          python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/diag.boundary.sh" "$RUNNER_TEMP/diag.resolution.sh"
          python3 stage4_tools/prepare_stage4_cycle9_diagnostic.py "$RUNNER_TEMP/diag.resolution.sh" "$RUNNER_TEMP/diag.final.sh"
          bash -n "$RUNNER_TEMP/diag.final.sh"
          grep -q 'STAGE4_DIAGNOSTIC_ONLY_SEEDED_FROM_RUN275_CYCLE9' "$RUNNER_TEMP/diag.final.sh"
          ! grep -q 'STAGE4_NATURAL_SEASON_PASS' "$RUNNER_TEMP/diag.final.sh"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Resume stock Career from cycle9 for blocker discovery only
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          STAGE4_DIAGNOSTIC_SEED: ${{ runner.temp }}/stage4-diagnostic-seed/run275/cycle-9-MonkeyGame.xml
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/diag.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/diag.pre.sh" "$RUNNER_TEMP/diag.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/diag.start.sh" "$RUNNER_TEMP/diag.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/diag.visual.sh" "$RUNNER_TEMP/diag.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/diag.offline.sh" "$RUNNER_TEMP/diag.short.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/diag.short.sh" "$RUNNER_TEMP/diag.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/diag.events.sh" "$RUNNER_TEMP/diag.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/diag.prematch.sh" "$RUNNER_TEMP/diag.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/diag.live.sh" "$RUNNER_TEMP/diag.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/diag.speed.sh" "$RUNNER_TEMP/diag.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/diag.boundary.sh" "$RUNNER_TEMP/diag.resolution.sh"
            python3 stage4_tools/prepare_stage4_cycle9_diagnostic.py "$RUNNER_TEMP/diag.resolution.sh" "$RUNNER_TEMP/diag.final.sh"
            bash -n "$RUNNER_TEMP/diag.final.sh"
            bash stage4_tools/run_stage4_natural_gate.sh "$RUNNER_TEMP/diag.final.sh"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-cycle9-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
