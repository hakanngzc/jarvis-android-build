name: NSS Stage1 Toolchain Export

on:
  push:
    paths:
      - '.github/workflows/nss-stage1-toolchain-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Install required Android tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/emulator/emulator" -version || true
      - name: Pack emulator and platform-tools
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$ANDROID_SDK_ROOT" -czf "$RUNNER_TEMP/nss-stage1-toolchain.tar.gz" emulator platform-tools
          ls -lh "$RUNNER_TEMP/nss-stage1-toolchain.tar.gz"
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage1-toolchain
          path: ${{ runner.temp }}/nss-stage1-toolchain.tar.gz
          compression-level: 0
          retention-days: 2
