name: NSS Stage2 Retirement Runtime 20261024

on:
  workflow_dispatch:
  push:
    branches:
      - nss-residual-static-20261024
    paths:
      - '.github/workflows/nss-stage2-retirement-runtime-20261024.yml'

permissions:
  contents: read

jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==12.0.0 frida==17.24.3
          npm install --no-save --ignore-scripts frida-java-bridge@7.0.13
      - name: Validate Stage2 branch transform
        working-directory: stage2
        run: python3 -m unittest test_patch_stage2_branch_driver.py test_patch_stage2_frida_smoke_driver.py -v
      - name: Derive Stage2 retirement driver
        run: |
          python3 stage2/patch_stage2_branch_driver.py \
            nss_stage3_knockout_runtime.sh stage2/run_stage2_retirement.sh
          bash -n stage2/run_stage2_retirement.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run stock Stage2 retirement save/restart/reload on API 34
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: STAGE2_SCENARIO='retirement' bash stage2/run_stage2_retirement.sh extra-time
      - name: Upload Stage2 retirement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage2-retirement-api34-isolated-20261024
          path: ${{ runner.temp }}/nss-stage3-knockout-extra-time/out/
          retention-days: 30
