name: NSS Stage4 Cycle9 Information Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [stage4-cycle7-nav-diagnostic-20261026]
    paths:
      - '.github/workflows/nss-stage4-cycle9-diagnostic.yml'
      - 'stage4_tools/run_stage4_cycle9_nav_diagnostic.sh'

permissions:
  contents: read
  actions: read

jobs:
  cycle9-navigation-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate diagnostic tooling
        run: |
          bash -n stage4_tools/run_stage4_cycle9_nav_diagnostic.sh stage4_natural_season_gate.sh
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Resume natural cycle9 save and verify cycle10 information navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-diagnostic.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-diagnostic.pre.sh" "$RUNNER_TEMP/stage4-diagnostic.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-diagnostic.start.sh" "$RUNNER_TEMP/stage4-diagnostic.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-diagnostic.visual.sh" "$RUNNER_TEMP/stage4-diagnostic.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-diagnostic.offline.sh" "$RUNNER_TEMP/stage4-diagnostic.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-diagnostic.shortleague.sh" "$RUNNER_TEMP/stage4-diagnostic.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-diagnostic.events.sh" "$RUNNER_TEMP/stage4-diagnostic.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-diagnostic.prematch.sh" "$RUNNER_TEMP/stage4-diagnostic.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-diagnostic.live.sh" "$RUNNER_TEMP/stage4-diagnostic.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-diagnostic.speed.sh" "$RUNNER_TEMP/stage4-diagnostic.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-diagnostic.boundary.sh" "$RUNNER_TEMP/stage4-diagnostic.final.sh"
            bash -n "$RUNNER_TEMP/stage4-diagnostic.final.sh"
            bash stage4_tools/run_stage4_cycle9_nav_diagnostic.sh "$RUNNER_TEMP/stage4-diagnostic.final.sh"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-cycle9-nav-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-cycle9-diagnostic/
          retention-days: 3
