name: NSS Stage1 Residual Public Verify
on:
  workflow_dispatch:
  push:
    branches: [stage1-residual-public-verify-20261023]
    paths:
      - 'stage1_public/**'
      - '.github/workflows/nss-stage1-residual-public-verify.yml'
permissions:
  contents: read
jobs:
  residual-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public-safe test harness
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow==13.0.0
          python3 -m py_compile stage1_public/dex_inspect.py stage1_public/patch_career_test_hook.py stage1_public/detect_stock_play.py stage1_public/test_detect_stock_play.py stage1_public/build_runtime_gate_v2.py
          python3 stage1_public/test_detect_stock_play.py
          python3 stage1_public/build_runtime_gate_v2.py
          bash -n stage1_public/runtime_gate_v2.sh
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage1-public/xapk" stage1_public_artifacts
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage1-public/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage1-public/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage1-public/nss431.xapk" -d "$RUNNER_TEMP/stage1-public/xapk"
          BASE="$RUNNER_TEMP/stage1-public/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "STOCK_XAPK_DIR=$RUNNER_TEMP/stage1-public/xapk" >> "$GITHUB_ENV"
      - name: Extract and verify stock UI geometry
        run: |
          set -euo pipefail
          python3 - "$BASE" stage1_public_artifacts <<'PY'
          import sys,zipfile,pathlib
          apk,out=sys.argv[1:]; out=pathlib.Path(out); out.mkdir(exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for suffix in ('/saveslot.uis','/mainmenu.uis','/messagebuttons.uih','/chooseclub.uis','/choosenation.uis'):
                  hits=[n for n in z.namelist() if n.lower().endswith(suffix)]
                  if len(hits)!=1: raise SystemExit(f'{suffix}: expected one hit, got {hits}')
                  n=hits[0]; data=z.read(n); p=out/pathlib.Path(n).name; p.write_bytes(data)
                  print('EXTRACTED',n,'bytes',len(data),'->',p)
          PY
          grep -q 'PushOrigin:(13,210)' stage1_public_artifacts/saveslot.uis
          grep -q 'PushOrigin:(13,384)' stage1_public_artifacts/saveslot.uis
          grep -q 'PushOrigin:(13,558)' stage1_public_artifacts/saveslot.uis
          grep -q 'Click(saveslot.btn_DeleteSlot?SLOTNUM?)' stage1_public_artifacts/saveslot.uis
          grep -q 'Click(saveslot.btn_Slot?SLOTNUM?)' stage1_public_artifacts/saveslot.uis
          grep -q 'Click(mainmenu.btn_Career)' stage1_public_artifacts/mainmenu.uis
          echo 'VERDICT=STAGE1_PUBLIC_STOCK_UI_GEOMETRY_PASS'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run stock residual persistence runtime gate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash stage1_public/runtime_gate_v2.sh
      - name: Require final residual verdict
        run: |
          set -euo pipefail
          grep -q '^SLOT1_RUNTIME=PASS$' stage1_public_artifacts/runtime/residual-gates.txt
          grep -q '^SLOT2_RUNTIME=PASS$' stage1_public_artifacts/runtime/residual-gates.txt
          grep -q '^DIRECTCAREERLOAD_RUNTIME=PASS$' stage1_public_artifacts/runtime/residual-gates.txt
          grep -q '^DELETECAREER_RUNTIME=PASS$' stage1_public_artifacts/runtime/residual-gates.txt
          grep -q '^RESIDUAL_STAGE1_RUNTIME=PASS$' stage1_public_artifacts/runtime/residual-gates.txt
          echo 'VERDICT=STAGE1_PUBLIC_STOCK_RESIDUAL_RUNTIME_PASS'
      - name: Upload Stage1 residual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage1-public-residual-runtime
          path: stage1_public_artifacts/**
