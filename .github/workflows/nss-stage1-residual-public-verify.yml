name: NSS Stage1 Residual Public Verify
on:
  workflow_dispatch:
  push:
    branches: [stage1-residual-public-verify-20261023]
    paths:
      - 'stage1_public/**'
      - '.github/workflows/nss-stage1-residual-public-verify.yml'
permissions:
  contents: read
jobs:
  stock-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage1-public/xapk" stage1_public_artifacts
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage1-public/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage1-public/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage1-public/nss431.xapk" -d "$RUNNER_TEMP/stage1-public/xapk"
          BASE="$RUNNER_TEMP/stage1-public/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Extract SaveSlot and MainMenu UI sources
        run: |
          set -euo pipefail
          python3 - "$BASE" stage1_public_artifacts <<'PY'
          import sys,zipfile,pathlib
          apk,out=sys.argv[1:]; out=pathlib.Path(out); out.mkdir(exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for suffix in ('/saveslot.uis','/mainmenu.uis','/messagebuttons.uih','/message.uih','/chooseclub.uis','/choosenation.uis'):
                  hits=[n for n in z.namelist() if n.lower().endswith(suffix)]
                  print(suffix, hits)
                  for n in hits:
                      data=z.read(n); p=out/pathlib.Path(n).name; p.write_bytes(data)
                      print('EXTRACTED',n,'bytes',len(data),'->',p)
          PY
          echo '--- saveslot.uis interesting lines ---'
          grep -Ein 'slot|delete|button|footer|message' stage1_public_artifacts/saveslot.uis || true
          echo '--- mainmenu.uis interesting lines ---'
          grep -Ein 'career|play|button|save|continue' stage1_public_artifacts/mainmenu.uis || true
          echo 'VERDICT=STAGE1_PUBLIC_STOCK_UI_INVENTORY_PASS'
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage1-public-stock-ui-inventory
          path: stage1_public_artifacts/**
