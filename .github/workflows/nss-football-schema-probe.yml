name: NSS 4.31 Football Schema Probe
on:
  push:
    branches:
      - nss-football-schema-probe-20261029
    paths:
      - 'nss_football_schema_probe.py'
      - 'nss_source_discovery.py'
      - '.github/workflows/nss-football-schema-probe.yml'
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Discover exact publisher-stock NSS 4.31 source via APKCombo
        run: |
          set -o pipefail
          python3 nss_source_discovery.py | tee "$RUNNER_TEMP/NSS_431_SOURCE_DISCOVERY.log"
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss431-football-database-schema-discovery
          path: ${{ runner.temp }}/NSS_431_SOURCE_DISCOVERY.log
