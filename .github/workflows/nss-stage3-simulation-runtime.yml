name: NSS Stage3 Stock Simulation Runtime

on:
  push:
    branches:
      - stage3-sim-runtime-20261021
    paths:
      - 'stage3_tools/**'
      - 'stage3_*.py'
      - 'test_stage3_*.py'
      - 'stage3_minimal_gate.sh'
      - '.github/workflows/nss-stage3-simulation-runtime.yml'
  workflow_dispatch:

jobs:
  simulation-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Simulation patch regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            test_stage3_debug_enabled_test_patch.py \
            test_stage3_simulation_runtime_patch.py \
            -v

      - name: Existing Stage3 state regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 stage3_runtime_hotfix.py
          python3 stage3_ad_overlay_state_patch.py
          python3 stage3_dilemma_state_patch.py
          python3 stage3_starman_state_patch.py
          python3 -m unittest \
            test_stage3_weeklyreview_state.py \
            test_stage3_ad_overlay_state.py \
            test_stage3_dilemma_state.py \
            test_stage3_dilemma_flow.py \
            test_stage3_starman_state.py \
            test_stage3_readiness_render_gate.py \
            -v

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 10 and verify stock neutral simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            python3 stage3_runtime_hotfix.py
            python3 stage3_ad_overlay_state_patch.py
            python3 stage3_dilemma_state_patch.py
            python3 stage3_starman_state_patch.py
            python3 stage3_career_input_retry_patch.py
            python3 stage3_readiness_patch.py
            python3 stage3_match_flow_patch.py
            python3 stage3_match_button_target_patch.py
            python3 stage3_reload_autoload_patch.py
            python3 stage3_simulation_runtime_patch.py
            bash -n stage3_minimal_gate.sh
            bash stage3_minimal_gate.sh

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-stock-simulation-evidence
          path: ${{ runner.temp }}/stage3-minimal/
          retention-days: 7
