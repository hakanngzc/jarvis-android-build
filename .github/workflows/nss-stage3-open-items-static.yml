name: NSS Stage3 Open Items Static

# v6 traces simulation/debug controls, football-domain writers, and domain assets.
on:
  push:
    branches:
      - stage3-sim-static-20261021
    paths:
      - 'stage3_tools/**'
      - '.github/workflows/nss-stage3-open-items-static.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified NSS 4.31 source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          XAPK_SHA='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          BASE_SHA='46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o /tmp/nss431.xapk
          echo "$XAPK_SHA  /tmp/nss431.xapk" | sha256sum -c -
          mkdir -p /tmp/nss431
          unzip -q /tmp/nss431.xapk -d /tmp/nss431
          BASE=/tmp/nss431/com.newstargames.newstarsoccer.apk
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Audit simulated match and debug flag
        shell: bash
        run: |
          set -euo pipefail
          python3 stage3_tools/audit_stage3_open_items.py "$BASE" | tee stage3-open-items-static.txt
          grep -q 'VERDICT=STAGE3_OPEN_ITEMS_STATIC_AUDIT_PASS' stage3-open-items-static.txt

      - name: Audit raw side-effect writers
        shell: bash
        run: |
          set -euo pipefail
          python3 stage3_tools/audit_stage3_side_effect_writers.py "$BASE" | tee stage3-side-effect-writers.txt
          grep -q 'VERDICT=STAGE3_SIDE_EFFECT_WRITER_AUDIT_PASS' stage3-side-effect-writers.txt

      - name: Audit precise football-domain side effects
        shell: bash
        run: |
          set -euo pipefail
          python3 stage3_tools/audit_stage3_domain_side_effects.py "$BASE" | tee stage3-domain-side-effects.txt
          grep -q 'VERDICT=STAGE3_DOMAIN_SIDE_EFFECT_AUDIT_PASS' stage3-domain-side-effects.txt

      - name: Audit injury and discipline asset terms
        shell: bash
        run: |
          set -euo pipefail
          python3 stage3_tools/audit_stage3_domain_assets.py "$BASE" | tee stage3-domain-assets.txt
          grep -q 'VERDICT=STAGE3_DOMAIN_ASSET_AUDIT_PASS' stage3-domain-assets.txt

      - name: Locate stock autoplay gadget definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$BASE" <<'PY' | tee stage3-autoplay-assets.txt
          import sys, zipfile
          apk = sys.argv[1]
          needles = [b'autoplayAverage', b'autoplayGood', b'autoplayPoor', b'DebugEnabled', b'dilemma.btn_relationship1', b'dilemma.btn_relationship2']
          hits = 0
          with zipfile.ZipFile(apk) as z:
              for info in z.infolist():
                  if info.file_size > 8_000_000:
                      continue
                  try:
                      data = z.read(info.filename)
                  except Exception:
                      continue
                  for needle in needles:
                      pos = data.find(needle)
                      if pos < 0:
                          continue
                      hits += 1
                      lo = max(0, pos - 900)
                      hi = min(len(data), pos + 1800)
                      chunk = data[lo:hi]
                      text = ''.join(chr(b) if b in (9,10,13) or 32 <= b < 127 else '.' for b in chunk)
                      print(f'ENTRY={info.filename} NEEDLE={needle.decode()} OFFSET={pos} SIZE={info.file_size}')
                      print(text)
                      print('---')
          print(f'ASSET_NEEDLE_HITS={hits}')
          PY
          grep -q 'autoplayAverage' stage3-autoplay-assets.txt

      - name: Upload static audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-open-items-static
          path: |
            stage3-open-items-static.txt
            stage3-side-effect-writers.txt
            stage3-domain-side-effects.txt
            stage3-domain-assets.txt
            stage3-autoplay-assets.txt
