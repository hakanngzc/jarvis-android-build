name: NSS Stage3 Open Items Static

# v2 traces the stock caller(s) of c_TScreen_Match.m_SimulateMatch.
on:
  push:
    branches:
      - stage3-sim-static-20261021
    paths:
      - 'stage3_tools/**'
      - '.github/workflows/nss-stage3-open-items-static.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified NSS 4.31 source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          XAPK_SHA='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          BASE_SHA='46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o /tmp/nss431.xapk
          echo "$XAPK_SHA  /tmp/nss431.xapk" | sha256sum -c -
          mkdir -p /tmp/nss431
          unzip -q /tmp/nss431.xapk -d /tmp/nss431
          BASE=/tmp/nss431/com.newstargames.newstarsoccer.apk
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Audit simulated match and side effects
        shell: bash
        run: |
          set -euo pipefail
          python3 stage3_tools/audit_stage3_open_items.py "$BASE" | tee stage3-open-items-static.txt
          grep -q 'VERDICT=STAGE3_OPEN_ITEMS_STATIC_AUDIT_PASS' stage3-open-items-static.txt

      - name: Upload static audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-open-items-static
          path: stage3-open-items-static.txt
