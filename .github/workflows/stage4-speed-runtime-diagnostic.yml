name: Stage4 stock speed runtime diagnostic

on:
  push:
    branches: [stage4-speed-runtime-diagnostic-20261026]

permissions:
  contents: read

jobs:
  rendered-speed-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate speed tooling
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py stage4_tools/validate_frame_png.py stage4_tools/find_match_speed.py
          python3 -m unittest test_stage4_match_speed.py -v
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Reach first natural match and prove stock MatchSpeed 350
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MIN_PROGRESS_DAYS: '90'
          MIN_MATCH_CYCLES: '1'
          MIN_WALL_SECONDS: '0'
          MAX_MATCH_CYCLES: '1'
          MATCH_TIMEOUT_SECONDS: '900'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-speed.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-speed.pre.sh" "$RUNNER_TEMP/stage4-speed.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-speed.start.sh" "$RUNNER_TEMP/stage4-speed.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-speed.visual.sh" "$RUNNER_TEMP/stage4-speed.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-speed.offline.sh" "$RUNNER_TEMP/stage4-speed.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-speed.shortleague.sh" "$RUNNER_TEMP/stage4-speed.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-speed.events.sh" "$RUNNER_TEMP/stage4-speed.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-speed.prematch.sh" "$RUNNER_TEMP/stage4-speed.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-speed.live.sh" "$RUNNER_TEMP/stage4-speed.fast.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-speed.fast.sh" "$RUNNER_TEMP/stage4-speed.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-speed.boundary.sh" "$RUNNER_TEMP/stage4-speed.final.sh"
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); s=p.read_text(encoding="utf-8"); old="      echo \\\"cycle $cycle stock MatchSpeed=350 verified\\\" >> \\\"$FLOW\\\"\\n      return 0"; new="      echo \\\"cycle $cycle stock MatchSpeed=350 verified\\\" >> \\\"$FLOW\\\"\\n      echo \\\"STAGE4_STOCK_MATCH_SPEED_350_PASS\\\" | tee \\\"$OUT/STAGE4_STOCK_MATCH_SPEED_RESULT.txt\\\"\\n      exit 0"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding="utf-8")' "$RUNNER_TEMP/stage4-speed.final.sh"
            bash -n "$RUNNER_TEMP/stage4-speed.final.sh"
            bash "$RUNNER_TEMP/stage4-speed.final.sh"
      - name: Upload speed proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-speed-runtime-evidence
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
