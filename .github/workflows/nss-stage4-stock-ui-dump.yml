name: NSS Stage4 Stock UI Dump

on:
  push:
    branches: [stage4-stock-ui-dump-20261026]

permissions:
  contents: read

jobs:
  dump-stock-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact stock NSS 4.31
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage4-stock-ui"
          mkdir -p "$OUT/xapk" "$OUT/extracted"
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          XAPK_SHA='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          BASE_SHA='46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4'
          curl -fL --retry 3 -A 'Mozilla/5.0' -e "$REFERER" "$URL" -o "$OUT/nss431.xapk"
          echo "$XAPK_SHA  $OUT/nss431.xapk" | sha256sum -c -
          unzip -q "$OUT/nss431.xapk" -d "$OUT/xapk"
          BASE="$OUT/xapk/com.newstargames.newstarsoccer.apk"
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          for f in desiredtransfer.uis pairs.uis casino.uis ButtonMacros.uis JDButtonMacros.uis messagemacro.uih; do
            unzip -p "$BASE" "assets/monkey/NewGUI/Screens/$f" > "$OUT/extracted/$f"
            test -s "$OUT/extracted/$f"
          done
          {
            echo '===== desiredtransfer.uis ====='
            cat "$OUT/extracted/desiredtransfer.uis"
            echo
            echo '===== pairs.uis refs/back/home ====='
            grep -Ein 'back|home|button|footer|ref:' "$OUT/extracted/pairs.uis" || true
            echo
            echo '===== casino.uis refs/back/home ====='
            grep -Ein 'back|home|button|footer|ref:' "$OUT/extracted/casino.uis" || true
            echo
            echo '===== ButtonMacros Back/Home refs ====='
            grep -Ein 'back|home' "$OUT/extracted/ButtonMacros.uis" || true
            echo
            echo '===== JDButtonMacros Back/Home refs ====='
            grep -Ein 'back|home' "$OUT/extracted/JDButtonMacros.uis" || true
          } | tee "$OUT/STAGE4_STOCK_UI_DUMP.txt"

      - name: Upload exact stock UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-stock-ui-dump
          path: ${{ runner.temp }}/stage4-stock-ui/
          retention-days: 7
