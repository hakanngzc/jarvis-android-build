name: NSS Android SDK Export

on:
  push:
    branches:
      - nss-sdk-export
    paths:
      - '.github/workflows/nss-sdk-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    env:
      SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "sdk_root=$SDK_ROOT"

      - name: Install minimal API 29 emulator SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            platform-tools \
            emulator \
            'build-tools;37.0.0' \
            'system-images;android-29;default;x86_64'

      - name: Package portable SDK subset
        shell: bash
        run: |
          set -euo pipefail
          SDK="$SDK_ROOT"
          rm -rf /tmp/nss-android-sdk
          mkdir -p /tmp/nss-android-sdk
          cp -a "$SDK/platform-tools" /tmp/nss-android-sdk/
          cp -a "$SDK/emulator" /tmp/nss-android-sdk/
          mkdir -p /tmp/nss-android-sdk/build-tools
          cp -a "$SDK/build-tools/37.0.0" /tmp/nss-android-sdk/build-tools/
          mkdir -p /tmp/nss-android-sdk/system-images/android-29/default
          cp -a "$SDK/system-images/android-29/default/x86_64" /tmp/nss-android-sdk/system-images/android-29/default/
          cp -a "$SDK/cmdline-tools" /tmp/nss-android-sdk/
          [ ! -d "$SDK/licenses" ] || cp -a "$SDK/licenses" /tmp/nss-android-sdk/
          tar -cf "$GITHUB_WORKSPACE/nss-android-sdk-api29.tar" -C /tmp nss-android-sdk
          du -h "$GITHUB_WORKSPACE/nss-android-sdk-api29.tar"

      - name: Upload portable SDK
        uses: actions/upload-artifact@v4
        with:
          name: nss-android-sdk-api29
          path: nss-android-sdk-api29.tar
          compression-level: 0
          retention-days: 1
