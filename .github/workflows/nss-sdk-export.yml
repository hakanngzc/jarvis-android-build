name: NSS Android SDK Export

on:
  push:
    branches:
      - nss-sdk-export
    paths:
      - '.github/workflows/nss-sdk-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    env:
      SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "sdk_root=$SDK_ROOT"

      - name: Install minimal API 29 emulator SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            platform-tools \
            emulator \
            'build-tools;37.0.0' \
            'system-images;android-29;default;x86_64'

      - name: Package and split sparse portable SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          cd "$SDK_ROOT"
          tar --sparse -I 'zstd -T0 -6' -cf "$GITHUB_WORKSPACE/nss-android-sdk-api29.tar.zst" \
            platform-tools \
            emulator \
            build-tools/37.0.0 \
            system-images/android-29/default/x86_64 \
            cmdline-tools \
            licenses
          cd "$GITHUB_WORKSPACE"
          split -b 300M nss-android-sdk-api29.tar.zst nss-sdk.part-
          ls -lh nss-sdk.part-*
          test -f nss-sdk.part-aa
          test -f nss-sdk.part-ab
          test -f nss-sdk.part-ac
          test -f nss-sdk.part-ad

      - name: Upload SDK part aa
        uses: actions/upload-artifact@v4
        with:
          name: nss-sdk-part-aa
          path: nss-sdk.part-aa
          compression-level: 0
          retention-days: 1

      - name: Upload SDK part ab
        uses: actions/upload-artifact@v4
        with:
          name: nss-sdk-part-ab
          path: nss-sdk.part-ab
          compression-level: 0
          retention-days: 1

      - name: Upload SDK part ac
        uses: actions/upload-artifact@v4
        with:
          name: nss-sdk-part-ac
          path: nss-sdk.part-ac
          compression-level: 0
          retention-days: 1

      - name: Upload SDK part ad
        uses: actions/upload-artifact@v4
        with:
          name: nss-sdk-part-ad
          path: nss-sdk.part-ad
          compression-level: 0
          retention-days: 1
