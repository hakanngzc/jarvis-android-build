name: NSS Android SDK Export

on:
  push:
    branches:
      - nss-sdk-export
    paths:
      - '.github/workflows/nss-sdk-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    env:
      SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "sdk_root=$SDK_ROOT"

      - name: Install minimal API 29 emulator SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            platform-tools \
            emulator \
            'build-tools;37.0.0' \
            'system-images;android-29;default;x86_64'

      - name: Package sparse portable SDK subset
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          cd "$SDK_ROOT"
          tar --sparse -I 'zstd -T0 -6' -cf "$GITHUB_WORKSPACE/nss-android-sdk-api29.tar.zst" \
            platform-tools \
            emulator \
            build-tools/37.0.0 \
            system-images/android-29/default/x86_64 \
            cmdline-tools \
            licenses
          ls -lh "$GITHUB_WORKSPACE/nss-android-sdk-api29.tar.zst"

      - name: Upload portable SDK
        uses: actions/upload-artifact@v4
        with:
          name: nss-android-sdk-api29-zstd
          path: nss-android-sdk-api29.tar.zst
          compression-level: 0
          retention-days: 1
