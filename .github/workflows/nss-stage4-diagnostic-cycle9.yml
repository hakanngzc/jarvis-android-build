name: NSS Stage4 Cycle9 Diagnostic

on:
  push:
    branches: [stage4-diagnostic-cycle9-20261026]

permissions:
  contents: read
  actions: read

jobs:
  cycle9-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate diagnostic tooling
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py stage4_tools/prepare_stage4_diagnostic_cycle9_seed.py
          bash -n stage4_natural_season_gate.sh
          python3 -m unittest test_stage4_event_navigation.py test_stage4_bux_shopoverlay_run270.py test_stage4_match_resolution.py -v

      - name: Download verified natural cycle9 seed
        uses: actions/download-artifact@v4
        with:
          name: stage4-natural-season-evidence
          path: ${{ runner.temp }}/stage4-cycle9-seed
          github-token: ${{ github.token }}
          repository: hakanngzc/jarvis-android-build
          run-id: 40314617549

      - name: Verify cycle9 seed
        run: |
          test -s "$RUNNER_TEMP/stage4-cycle9-seed/cycle-9-MonkeyGame.xml"
          grep -q monkeystate "$RUNNER_TEMP/stage4-cycle9-seed/cycle-9-MonkeyGame.xml"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Continue naturally from verified cycle9 save
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MIN_PROGRESS_DAYS: '0'
          MIN_MATCH_CYCLES: '1'
          MIN_WALL_SECONDS: '0'
          MAX_MATCH_CYCLES: '30'
          MATCH_TIMEOUT_SECONDS: '900'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-diag.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-diag.pre.sh" "$RUNNER_TEMP/stage4-diag.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-diag.start.sh" "$RUNNER_TEMP/stage4-diag.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-diag.visual.sh" "$RUNNER_TEMP/stage4-diag.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-diag.offline.sh" "$RUNNER_TEMP/stage4-diag.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-diag.shortleague.sh" "$RUNNER_TEMP/stage4-diag.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-diag.events.sh" "$RUNNER_TEMP/stage4-diag.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-diag.prematch.sh" "$RUNNER_TEMP/stage4-diag.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-diag.live.sh" "$RUNNER_TEMP/stage4-diag.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-diag.speed.sh" "$RUNNER_TEMP/stage4-diag.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-diag.boundary.sh" "$RUNNER_TEMP/stage4-diag.resolution.sh"
            python3 stage4_tools/prepare_stage4_diagnostic_cycle9_seed.py "$RUNNER_TEMP/stage4-diag.resolution.sh" "$RUNNER_TEMP/stage4-diag.seeded.sh"
            bash -n "$RUNNER_TEMP/stage4-diag.seeded.sh"
            bash stage4_tools/run_stage4_natural_gate.sh "$RUNNER_TEMP/stage4-diag.seeded.sh"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-cycle9-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 3
