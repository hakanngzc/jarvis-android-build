name: NSS Stage6 Production Runtime
on:
  workflow_dispatch:
  push:
    branches: [stage6-production-rollout-20261024]
    paths:
      - 'stage6_public/production_runtime_smoke.sh'
      - 'stage6_public/production_logo_pipeline.py'
      - 'stage6_public/build_production_logo_apk.py'
      - 'stage6_public/patch_club_badge_override.py'
      - 'stage6_public/verify_rebuilt_badge_override.py'
      - 'stage6_public/apply_club_badge_override_dex.sh'
      - 'stage6_public/manifests/**'
      - '.github/workflows/nss-stage6-production-runtime.yml'
permissions:
  contents: read
concurrency:
  group: nss-stage6-production-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate production runtime harness
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          bash -n stage6_public/production_runtime_smoke.sh
          bash -n stage6_public/apply_club_badge_override_dex.sh
          python3 -m py_compile \
            stage6_public/production_logo_pipeline.py \
            stage6_public/build_production_logo_apk.py \
            stage6_public/patch_club_badge_override.py \
            stage6_public/verify_rebuilt_badge_override.py
          PYTHONPATH=stage6_public python3 -m unittest \
            stage6_public/test_production_logo_pipeline.py \
            stage6_public/test_production_logo_multrow.py \
            stage6_public/test_build_production_logo_apk.py \
            stage6_public/test_patch_club_badge_override_mapping.py \
            stage6_public/test_verify_rebuilt_badge_override.py -v
      - name: Generate CI-only TUR1 logo inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw
          manifest=Path('stage6_public/manifests/turkey_tur1.json')
          root=manifest.parent.resolve(); data=json.loads(manifest.read_text(encoding='utf-8'))
          for row in data['clubs']:
              cid=int(row['club_id']); out=(root/row['asset']).resolve(); out.relative_to(root)
              out.parent.mkdir(parents=True,exist_ok=True)
              a=(cid*37)%190+30; b=(cid*71)%190+30; c=(cid*101)%190+30
              im=Image.new('RGBA',(128,128),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.rounded_rectangle((8,8,120,120),radius=22,fill=(245,240,222,255),outline=(18,35,55,255),width=6)
              d.polygon([(16,20),(112,20),(96,106),(64,120),(32,106)],fill=(a,b,c,255))
              d.rectangle((27,42,101,55),fill=(18,35,55,255)); d.text((34,66),str(cid),fill=(255,255,255,255))
              im.save(out)
          print('STAGE6_CI_ASSETS=PASS count='+str(len(data['clubs']))+' test_only=true')
          PY
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-production-runtime/xapk" stage6_public_artifacts/production-runtime
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage6-production-runtime/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage6-production-runtime/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage6-production-runtime/nss431.xapk" -d "$RUNNER_TEMP/stage6-production-runtime/xapk"
          BASE="$RUNNER_TEMP/stage6-production-runtime/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "STOCK_XAPK_DIR=$RUNNER_TEMP/stage6-production-runtime/xapk" >> "$GITHUB_ENV"
      - name: Download pinned smali toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-production-runtime/tools"
          BAK="$RUNNER_TEMP/stage6-production-runtime/tools/baksmali-3.0.10-fat.jar"
          SMA="$RUNNER_TEMP/stage6-production-runtime/tools/smali-3.0.10-fat.jar"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar' -o "$BAK"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar' -o "$SMA"
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  '"$BAK" | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  '"$SMA" | sha256sum -c -
          echo "BAKSMALI_JAR=$BAK" >> "$GITHUB_ENV"
          echo "SMALI_JAR=$SMA" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run production Android runtime smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash stage6_public/production_runtime_smoke.sh
      - name: Require production runtime verdict
        run: |
          set -euo pipefail
          G=stage6_public_artifacts/production-runtime/stage6-production-runtime-gates.txt
          grep -q '^STAGE6_PRODUCTION_ASSET_BUILD=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_DEX_MAPPING=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_STATIC_INPUT=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_INSTALLED=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_COLD_LAUNCH=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_RELAUNCH=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_SCREENSHOT=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_RUNTIME_STABILITY=PASS$' "$G"
          grep -q '^STAGE6_PRODUCTION_RUNTIME=PASS$' "$G"
          test -s stage6_public_artifacts/production-runtime/cold.png
          test -s stage6_public_artifacts/production-runtime/relaunch.png
          echo 'STAGE6_PRODUCTION_RUNTIME_VERDICT=PASS'
      - name: Upload production runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage6-production-runtime
          path: stage6_public_artifacts/production-runtime/**
