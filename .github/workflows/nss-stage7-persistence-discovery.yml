name: NSS Stage7 Persistence Discovery
on:
  workflow_dispatch:
  push:
    branches: [stage7-persistence-discovery-20261023]
    paths:
      - 'stage7_public/**'
      - '.github/workflows/nss-stage7-persistence-discovery.yml'
permissions:
  contents: read
jobs:
  persistence-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate discovery code
        run: python3 -m py_compile stage7_public/discover_stage7_persistence.py
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage7/xapk" stage7_public_artifacts
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage7/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage7/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage7/nss431.xapk" -d "$RUNNER_TEMP/stage7/xapk"
          BASE="$RUNNER_TEMP/stage7/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Discover Stage7 state owners and accesses
        run: |
          set -euo pipefail
          python3 stage7_public/discover_stage7_persistence.py "$BASE" stage7_public_artifacts/stage7-persistence-discovery.json
          python3 - <<'PY'
          import json
          p=json.load(open('stage7_public_artifacts/stage7-persistence-discovery.json',encoding='utf-8'))
          names={x['name'] for x in p['player_fields']}
          for required in ('m_wage','m_goalbonus','m_assistbonus','m_bank'):
              assert required in names, (required, sorted(n for n in names if required.strip('m_') in n))
          assert p['candidate_fields']
          assert p['field_access_methods']
          print('VERDICT=STAGE7_DISCOVERY_PASS')
          print('PLAYER_FIELDS',len(p['player_fields']))
          print('CANDIDATE_FIELDS',len(p['candidate_fields']))
          print('ACCESS_METHODS',len(p['field_access_methods']))
          print('SAVE_LOAD_METHODS',len(p['player_save_load_methods']))
          PY
      - name: Upload Stage7 discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage7-persistence-discovery
          path: stage7_public_artifacts/**
