name: NSS Stage7 Player Persistence Discovery
on:
  workflow_dispatch:
  push:
    branches: [stage7-persistent-subsystems-20261024]
    paths:
      - 'stage7_public/**'
      - '.github/workflows/nss-stage7-player-persistence-discovery.yml'
permissions:
  contents: read
jobs:
  player-persistence-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Stage7 discovery harness
        run: |
          set -euo pipefail
          python3 -m py_compile stage7_public/dump_player_persistence.py stage7_public/dump_stage7_core.py stage1_public/dex_inspect.py
          PYTHONPATH=stage7_public python3 -m unittest stage7_public/test_persistence_fixture_patch.py -v
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage7-public/xapk" stage7_public_artifacts
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage7-public/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage7-public/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage7-public/nss431.xapk" -d "$RUNNER_TEMP/stage7-public/xapk"
          BASE="$RUNNER_TEMP/stage7-public/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Dump exact player persistence ownership
        run: |
          set -euo pipefail
          python3 stage7_public/dump_player_persistence.py "$BASE" stage7_public_artifacts
          python3 stage7_public/dump_stage7_core.py "$BASE" stage7_public_artifacts/stage7-core-writers-disasm.txt
          python3 - <<'PY'
          import json
          p=json.load(open('stage7_public_artifacts/stage7-player-persistence-inventory.json',encoding='utf-8'))
          assert p['player_fields']
          assert p['player_methods']
          assert p['save_related_methods']
          print('VERDICT=STAGE7_PLAYER_PERSISTENCE_DISCOVERY_PASS')
          PY
      - name: Upload Stage7 discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage7-player-persistence-discovery
          path: stage7_public_artifacts/**
