name: NSS Runtime Bypass

on:
  push:
    paths:
      - '.github/workflows/nss-runtime-bypass.yml'
      - 'aosp_artifact_chunks.py'
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  aosp29-chunks:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'tmp-aosp29-runtime-trigger'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare GMS-free AOSP Android 10 image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            test -f "$ANDROID_HOME/system-images/android-29/default/x86_64/system.img"
            mkdir -p "$RUNNER_TEMP/aosp-parts"
            tar -C "$ANDROID_HOME/system-images/android-29/default" -czf "$RUNNER_TEMP/aosp29-system-image.tgz" x86_64
            python3 aosp_artifact_chunks.py "$RUNNER_TEMP/aosp29-system-image.tgz" "$RUNNER_TEMP/aosp-parts"
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-00
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-01
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-02
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-03
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-checksums
          path: ${{ runner.temp }}/aosp-parts/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1

  nss431-source-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp-uptodown-source-probe'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact APKPure 4.31 and verify base APK hash
        run: |
          set -o pipefail
          python3 uptodown_431_gate.py /tmp/nss-4.31.xapk "$RUNNER_TEMP/NSS_431_SOURCE_GATE.txt" | tee "$RUNNER_TEMP/NSS_431_SOURCE_GATE.log"
      - name: Upload source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss431-source-gate
          path: |
            ${{ runner.temp }}/NSS_431_SOURCE_GATE.txt
            ${{ runner.temp }}/NSS_431_SOURCE_GATE.log
          retention-days: 1

  nss431-kvm-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp-uptodown-source-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 10 and launch exact NSS 4.31
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            OUT="$RUNNER_TEMP/nss431-kvm-smoke"
            mkdir -p "$OUT/xapk"
            URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
            curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' \
              -e 'https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31' \
              "$URL" -o "$OUT/nss431.xapk"
            echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$OUT/nss431.xapk" | sha256sum -c -
            unzip -q "$OUT/nss431.xapk" -d "$OUT/xapk"
            echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$OUT/xapk/com.newstargames.newstarsoccer.apk" | sha256sum -c -
            adb install-multiple -r \
              "$OUT/xapk/com.newstargames.newstarsoccer.apk" \
              "$OUT/xapk/config.tr.apk" \
              "$OUT/xapk/config.xxhdpi.apk"
            adb shell dumpsys package com.newstargames.newstarsoccer > "$OUT/package.txt"
            grep -q 'versionCode=137' "$OUT/package.txt"
            grep -q 'versionName=4.31' "$OUT/package.txt"
            adb logcat -c || true
            adb shell am start -n com.newstargames.newstarsoccer/.MonkeyGame > "$OUT/am-start.txt"
            for i in $(seq 1 60); do
              sleep 1
              adb logcat -d -v brief > "$OUT/logcat.txt" || true
              if grep -qiE 'Create Screen:[[:space:]]*mainmenu|SETTING ACTIVE:[[:space:]]*mainmenu|SetActive:[[:space:]]*mainmenu' "$OUT/logcat.txt"; then
                echo "MAINMENU_REACHED_AFTER=${i}s" | tee "$OUT/verdict.txt"
                break
              fi
              if grep -qiE 'FATAL EXCEPTION.*newstarsoccer|Process: com\.newstargames\.newstarsoccer|ANR in com\.newstargames\.newstarsoccer' "$OUT/logcat.txt"; then
                echo 'NSS_RUNTIME_FATAL' | tee "$OUT/verdict.txt"
                exit 41
              fi
            done
            adb exec-out screencap -p > "$OUT/screen.png" || true
            adb shell dumpsys activity activities > "$OUT/activity.txt" || true
            pidof=$(adb shell pidof com.newstargames.newstarsoccer | tr -d '\r' || true)
            echo "PID=$pidof" >> "$OUT/verdict.txt"
            test -n "$pidof"
            grep -q 'MAINMENU_REACHED' "$OUT/verdict.txt"
            echo 'NSS431_KVM_SMOKE=PASS' | tee -a "$OUT/verdict.txt"
      - name: Upload KVM smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss431-kvm-smoke
          path: ${{ runner.temp }}/nss431-kvm-smoke/
          retention-days: 1
