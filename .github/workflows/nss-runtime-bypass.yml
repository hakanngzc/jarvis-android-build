name: NSS Runtime Bypass

on:
  push:
    paths:
      - '.github/workflows/nss-runtime-bypass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aosp29-system-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install clean AOSP Android 10 image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-29;default;x86_64"

      - name: Pack only the system image
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$ANDROID_HOME/system-images/android-29/default" -czf "$RUNNER_TEMP/aosp29-system-image.tgz" x86_64
          sha256sum "$RUNNER_TEMP/aosp29-system-image.tgz" | tee "$RUNNER_TEMP/aosp29-system-image.sha256"
          du -h "$RUNNER_TEMP/aosp29-system-image.tgz"

      - name: Upload AOSP image
        uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-system-image
          path: |
            ${{ runner.temp }}/aosp29-system-image.tgz
            ${{ runner.temp }}/aosp29-system-image.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
