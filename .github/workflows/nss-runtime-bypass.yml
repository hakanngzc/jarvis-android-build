name: NSS Runtime Bypass

on:
  push:
    paths:
      - '.github/workflows/nss-runtime-bypass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 10 and verify ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            adb shell 'echo NSS_PUBLIC_RUNTIME_OK'

      - name: Build split API29 payload
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          [ -d "$SDK/system-images/android-29/google_apis/x86_64" ]
          [ -x "$BUILD_TOOLS/apksigner" ]
          [ -x "$BUILD_TOOLS/zipalign" ]

          ROOT="$RUNNER_TEMP/nss-api29-payload"
          rm -rf "$ROOT" portable-chunks
          mkdir -p \
            "$ROOT/android-sdk/system-images/android-29/google_apis" \
            "$ROOT/android-sdk/build-tools" \
            portable-chunks

          cp -a "$SDK/system-images/android-29/google_apis/x86_64" \
            "$ROOT/android-sdk/system-images/android-29/google_apis/"
          cp -a "$BUILD_TOOLS" "$ROOT/android-sdk/build-tools/"

          cat > "$ROOT/PAYLOAD_INFO.txt" <<EOF
          api=29
          android=10
          abi=x86_64
          build_tools=$(basename "$BUILD_TOOLS")
          emulator_included=NO
          platform_tools_included=NO
          game_payload_included=NO
          EOF

          du -sh "$ROOT" | tee "$ROOT/PAYLOAD_SIZE.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/nss-api29-payload.tgz" nss-api29-payload
          sha256sum "$RUNNER_TEMP/nss-api29-payload.tgz" | tee portable-chunks/payload.sha256
          split -b 256M -d -a 2 "$RUNNER_TEMP/nss-api29-payload.tgz" portable-chunks/payload.part-
          ls -lh portable-chunks/

      - name: Upload payload part 00
        if: ${{ hashFiles('portable-chunks/payload.part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-00
          path: |
            portable-chunks/payload.part-00
            portable-chunks/payload.sha256
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 01
        if: ${{ hashFiles('portable-chunks/payload.part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-01
          path: portable-chunks/payload.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 02
        if: ${{ hashFiles('portable-chunks/payload.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-02
          path: portable-chunks/payload.part-02
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 03
        if: ${{ hashFiles('portable-chunks/payload.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-03
          path: portable-chunks/payload.part-03
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 04
        if: ${{ hashFiles('portable-chunks/payload.part-04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-04
          path: portable-chunks/payload.part-04
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 05
        if: ${{ hashFiles('portable-chunks/payload.part-05') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-05
          path: portable-chunks/payload.part-05
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 06
        if: ${{ hashFiles('portable-chunks/payload.part-06') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-06
          path: portable-chunks/payload.part-06
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 07
        if: ${{ hashFiles('portable-chunks/payload.part-07') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-07
          path: portable-chunks/payload.part-07
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 08
        if: ${{ hashFiles('portable-chunks/payload.part-08') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-08
          path: portable-chunks/payload.part-08
          compression-level: 0
          retention-days: 1
      - name: Upload payload part 09
        if: ${{ hashFiles('portable-chunks/payload.part-09') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nss-api29-payload-09
          path: portable-chunks/payload.part-09
          compression-level: 0
          retention-days: 1
