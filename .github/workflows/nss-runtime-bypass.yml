name: NSS Runtime Bypass

on:
  push:
    paths:
      - '.github/workflows/nss-runtime-bypass.yml'
      - 'aosp_artifact_chunks.py'
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  aosp29-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare GMS-free AOSP Android 10 image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            IMG="$ANDROID_HOME/system-images/android-29/default/x86_64"
            test -f "$IMG/system.img"
            mkdir -p "$RUNNER_TEMP/aosp-parts"
            tar -C "$ANDROID_HOME/system-images/android-29/default" -czf "$RUNNER_TEMP/aosp29-system-image.tgz" x86_64
            python3 aosp_artifact_chunks.py "$RUNNER_TEMP/aosp29-system-image.tgz" "$RUNNER_TEMP/aosp-parts"
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-parts
          path: ${{ runner.temp }}/aosp-parts/
          compression-level: 0
          retention-days: 1
