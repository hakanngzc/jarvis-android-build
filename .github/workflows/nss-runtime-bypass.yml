name: NSS Runtime Bypass

on:
  push:
    paths:
      - '.github/workflows/nss-runtime-bypass.yml'
      - 'aosp_artifact_chunks.py'
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  aosp29-chunks:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'tmp-aosp29-runtime-trigger'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare GMS-free AOSP Android 10 image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            test -f "$ANDROID_HOME/system-images/android-29/default/x86_64/system.img"
            mkdir -p "$RUNNER_TEMP/aosp-parts"
            tar -C "$ANDROID_HOME/system-images/android-29/default" -czf "$RUNNER_TEMP/aosp29-system-image.tgz" x86_64
            python3 aosp_artifact_chunks.py "$RUNNER_TEMP/aosp29-system-image.tgz" "$RUNNER_TEMP/aosp-parts"
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-00
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-01
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-02
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-03
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-checksums
          path: ${{ runner.temp }}/aosp-parts/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1

  nss431-source-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp-uptodown-source-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Uptodown 4.31 and verify exact base APK hash
        run: |
          set -o pipefail
          python3 uptodown_431_gate.py /tmp/nss-4.31.xapk "$RUNNER_TEMP/NSS_431_SOURCE_GATE.txt" | tee "$RUNNER_TEMP/NSS_431_SOURCE_GATE.log"
      - name: Upload source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss431-source-gate
          path: |
            ${{ runner.temp }}/NSS_431_SOURCE_GATE.txt
            ${{ runner.temp }}/NSS_431_SOURCE_GATE.log
          retention-days: 1

  stage3-kvm-runtime:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp-stage3-kvm-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Static-check Stage3 runtime harness
        run: |
          set -euo pipefail
          bash -n stage3_runtime/public_stage3_gate.sh
          python3 -m py_compile \
            stage3_runtime/tools/dex_inspect.py \
            stage3_runtime/tools/patch_cloud_startup_bypass_for_persistence_test.py \
            stage3_runtime/tools/patch_trial_skip_for_persistence_test.py \
            stage3_runtime/tools/patch_stage3_fast_match_probe.py
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Stage3 lifecycle gate on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: TEST_NAME=stage3-public-api29 bash stage3_runtime/public_stage3_gate.sh
      - name: Upload Stage3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss-stage3-public-api29
          path: artifacts/stage3-public-api29/
          retention-days: 2
