name: NSS Runtime Bypass

on:
  push:
    paths:
      - '.github/workflows/nss-runtime-bypass.yml'
      - 'aosp_artifact_chunks.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aosp29-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install AOSP Android 10 image
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-29;default;x86_64"
      - name: Pack and chunk image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-parts"
          tar -C "$ANDROID_HOME/system-images/android-29/default" -czf "$RUNNER_TEMP/aosp29-system-image.tgz" x86_64
          python3 aosp_artifact_chunks.py "$RUNNER_TEMP/aosp29-system-image.tgz" "$RUNNER_TEMP/aosp-parts"
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-00
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-01
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-02
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-part-03
          path: ${{ runner.temp }}/aosp-parts/aosp29.part-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nss-aosp29-checksums
          path: ${{ runner.temp }}/aosp-parts/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
