# Residual runtime closure: shared durable-save bootstrap plus rendered natural live-match input.
name: NSS Residual Runtime Closure

on:
  workflow_dispatch:
  push:
    branches: [nss-residual-runtime-20261024]

permissions:
  contents: read

jobs:
  stage2-residual-runtime:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Stage4 natural season runtime gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate residual tooling
        run: |
          python3 -m py_compile stage2_residual_tools/*.py stage4_tools/*.py
          bash -n stage2_residual_gate.sh stage4_natural_season_gate.sh
          python3 -m unittest test_stage2_residual_contract.py test_stage2_retire_restart_policy.py test_chooseclub_step_targets.py test_runtime_start_retry.py test_verify_stage2_residual.py test_stage4_natural_policy.py -v

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 10 and verify contract transfer retirement persistence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage2_residual_gate.sh "$RUNNER_TEMP/stage2-residual-gate.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage2-residual-gate.pre.sh" "$RUNNER_TEMP/stage2-residual-gate.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage2-residual-gate.start.sh" "$RUNNER_TEMP/stage2-residual-gate.visual.sh"
            python3 stage2_residual_tools/prepare_stage2_gamemenu_stable.py "$RUNNER_TEMP/stage2-residual-gate.visual.sh" "$RUNNER_TEMP/stage2-residual-gate.stable.sh"
            python3 stage2_residual_tools/prepare_stage2_retire_restart.py "$RUNNER_TEMP/stage2-residual-gate.stable.sh" "$RUNNER_TEMP/stage2-residual-gate.retire.sh"
            bash -n "$RUNNER_TEMP/stage2-residual-gate.retire.sh"
            bash "$RUNNER_TEMP/stage2-residual-gate.retire.sh"

      - name: Upload Stage2 residual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-residual-runtime-evidence
          path: ${{ runner.temp }}/stage2-residual/
          retention-days: 7

  stage4-natural-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Stage4 natural season runtime gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate natural-season tooling
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py stage4_tools/validate_frame_png.py stage4_tools/find_league_picker.py stage4_tools/find_dilemma_choice.py stage4_tools/find_live_ball.py stage4_tools/find_kick_ball.py stage4_tools/find_match_resume.py stage4_tools/find_match_speed.py stage4_tools/classify_live_frame.py stage4_tools/verify_stage4_natural_season.py
          bash -n stage4_natural_season_gate.sh stage4_tools/run_stage4_natural_gate.sh
          python3 -m unittest test_stage4_natural_policy.py test_stage4_timeout_budget.py test_stage4_offline_runtime.py test_stage4_short_league.py test_stage4_event_navigation.py test_stage4_bux_shopoverlay_run270.py test_stage4_live_ball_driver.py test_stage4_match_speed.py test_stage4_live_input_speed.py test_stage4_single_decode_classifier.py test_stage4_boundary_scope.py test_stage4_match_resolution.py test_stage2_residual_contract.py test_chooseclub_step_targets.py test_runtime_start_retry.py -v

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 10 and run a natural full season
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MIN_PROGRESS_DAYS: '90'
          MIN_MATCH_CYCLES: '12'
          MIN_WALL_SECONDS: '1200'
          MAX_MATCH_CYCLES: '60'
          MATCH_TIMEOUT_SECONDS: '900'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-natural-gate.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-natural-gate.pre.sh" "$RUNNER_TEMP/stage4-natural-gate.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-natural-gate.start.sh" "$RUNNER_TEMP/stage4-natural-gate.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-natural-gate.visual.sh" "$RUNNER_TEMP/stage4-natural-gate.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-natural-gate.offline.sh" "$RUNNER_TEMP/stage4-natural-gate.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-natural-gate.shortleague.sh" "$RUNNER_TEMP/stage4-natural-gate.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-natural-gate.events.sh" "$RUNNER_TEMP/stage4-natural-gate.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-natural-gate.prematch.sh" "$RUNNER_TEMP/stage4-natural-gate.live.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-natural-gate.live.sh" "$RUNNER_TEMP/stage4-natural-gate.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-natural-gate.speed.sh" "$RUNNER_TEMP/stage4-natural-gate.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-natural-gate.boundary.sh" "$RUNNER_TEMP/stage4-natural-gate.resolution.sh"
            mv "$RUNNER_TEMP/stage4-natural-gate.resolution.sh" "$RUNNER_TEMP/stage4-natural-gate.live.sh"
            bash -n "$RUNNER_TEMP/stage4-natural-gate.live.sh"
            bash stage4_tools/run_stage4_natural_gate.sh "$RUNNER_TEMP/stage4-natural-gate.live.sh"

      - name: Upload Stage4 natural-season evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-natural-season-evidence
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
