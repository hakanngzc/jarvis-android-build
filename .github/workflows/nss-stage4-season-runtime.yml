name: NSS Stage4 Season Runtime

on:
  workflow_dispatch:
  push:
    branches: [nss-residual-runtime-20261024]

permissions:
  contents: read

jobs:
  residual-contract-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run residual contract tests
        run: python3 -m unittest test_stage2_residual_contract.py test_stage4_natural_policy.py -v
