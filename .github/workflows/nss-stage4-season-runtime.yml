name: NSS Stage4 Short League Diagnostic

on:
  push:
    branches: [stage4-short-league-diagnostic-20261025]

permissions:
  contents: read

jobs:
  stage4-short-league-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate diagnostic tooling
        run: |
          python3 -m py_compile \
            stage2_residual_tools/prepare_stage2_gate.py \
            stage2_residual_tools/prepare_runtime_start_retry.py \
            stage2_residual_tools/prepare_chooseclub_visual.py \
            stage4_tools/prepare_stage4_prematch.py \
            stage4_tools/prepare_stage4_live_input.py \
            stage4_tools/prepare_stage4_short_league_diagnostic.py
          bash -n stage4_natural_season_gate.sh

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Capture stock league selector sequence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-diag.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-diag.pre.sh" "$RUNNER_TEMP/stage4-diag.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-diag.start.sh" "$RUNNER_TEMP/stage4-diag.visual.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-diag.visual.sh" "$RUNNER_TEMP/stage4-diag.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-diag.prematch.sh" "$RUNNER_TEMP/stage4-diag.live.sh"
            python3 stage4_tools/prepare_stage4_short_league_diagnostic.py "$RUNNER_TEMP/stage4-diag.live.sh" "$RUNNER_TEMP/stage4-diag.final.sh"
            bash -n "$RUNNER_TEMP/stage4-diag.final.sh"
            bash "$RUNNER_TEMP/stage4-diag.final.sh"

      - name: Upload selector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-short-league-selector-evidence
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
