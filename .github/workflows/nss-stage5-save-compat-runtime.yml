name: NSS Stage5 Old-Save Name Compatibility Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - nss-stage5-save-compat-20261023
    paths:
      - '.github/workflows/nss-stage5-save-compat-runtime.yml'
      - 'stage5/**'

permissions:
  contents: read

jobs:
  old-save-name-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Python image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Validate Stage5 contracts
        run: |
          python -m unittest stage5/test_name_only_patch.py -v
          python -m unittest stage5/test_runtime_gate_contract.py -v
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Stage5 old-save compatibility gate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash stage5/run_save_compat.sh
      - name: Upload Stage5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage5-old-save-name-compat-public-api29
          path: ${{ runner.temp }}/nss-stage5-save-compat/out/
          retention-days: 2
