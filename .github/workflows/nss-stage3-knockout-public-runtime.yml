name: NSS Stage3 Knockout Public Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - nss-stage3-knockout-runtime-20261023
    paths:
      - '.github/workflows/nss-stage3-knockout-public-runtime.yml'
      - 'nss_stage3_knockout_runtime.sh'
      - 'stage3/**'
      - 'tools/dex_inspect.py'
      - 'tools/patch_cloud_startup_bypass_for_persistence_test.py'
      - 'tools/patch_trial_skip_for_persistence_test.py'

permissions:
  contents: read

jobs:
  knockout-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [extra-time, shootout]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Python image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Normalize helper runtime harness
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nss_stage3_knockout_runtime.sh')
          text = p.read_text(encoding='utf-8')
          old_sign = '  local src="$1" dst="$2" aligned="$WORK/aligned-$(basename "$dst")"\n'
          new_sign = '  local src="$1" dst="$2"\n  local aligned="$WORK/aligned-$(basename "$dst")"\n'
          if old_sign not in text:
              raise SystemExit('expected sign_one declaration not found')
          text = text.replace(old_sign, new_sign, 1)

          old_menu = 'press_physical 810 1450 2\nwait_log \'Create Screen:[[:space:]]*saveslot|SetActive:[[:space:]]*saveslot|SETTING ACTIVE:[[:space:]]*saveslot\' 25 saveslot\n'
          new_menu = 'python3 stage3/pick_mainmenu_play.py "$OUT/stock-mainmenu-rendered.png" "$WORK/mainmenu-play.txt"\nread -r MAIN_X MAIN_Y < "$WORK/mainmenu-play.txt"\npress_physical "$MAIN_X" "$MAIN_Y" 2\nwait_log \'Create Screen:[[:space:]]*saveslot|SetActive:[[:space:]]*saveslot|SETTING ACTIVE:[[:space:]]*saveslot\' 25 saveslot\n'
          if old_menu not in text:
              raise SystemExit('expected MainMenu fixed tap block not found')
          text = text.replace(old_menu, new_menu, 1)

          old_slot = 'find_slot0_target "$OUT/saveslot.png" "$WORK/slot0.txt"\n'
          new_slot = 'python3 stage3/pick_saveslot.py "$OUT/saveslot.png" "$WORK/slot0.txt"\n'
          if old_slot not in text:
              raise SystemExit('expected SaveSlot selector call not found')
          text = text.replace(old_slot, new_slot, 1)

          old_career = (
              "wait_log 'SETTING ACTIVE:[[:space:]]*gamemenu|SetActive:[[:space:]]*gamemenu|Create Screen:[[:space:]]*gamemenu' 35 gamemenu\n"
              "shot career-gamemenu\n"
          )
          new_career = (
              "echo 'Restarting after stock Career save and loading slot 0'\n"
              "start_menu\n"
              "python3 stage3/pick_mainmenu_play.py \"$OUT/stock-mainmenu-rendered.png\" \"$WORK/reload-mainmenu-play.txt\"\n"
              "read -r RELOAD_MAIN_X RELOAD_MAIN_Y < \"$WORK/reload-mainmenu-play.txt\"\n"
              "clear_log\n"
              "press_physical \"$RELOAD_MAIN_X\" \"$RELOAD_MAIN_Y\" 2\n"
              "wait_log 'Create Screen:[[:space:]]*saveslot|SetActive:[[:space:]]*saveslot|SETTING ACTIVE:[[:space:]]*saveslot' 25 reload-saveslot\n"
              "shot reload-saveslot\n"
              "python3 stage3/pick_saveslot.py \"$OUT/reload-saveslot.png\" \"$WORK/reload-slot0.txt\"\n"
              "read -r RELOAD_SLOT_X RELOAD_SLOT_Y < \"$WORK/reload-slot0.txt\"\n"
              "clear_log\n"
              "press_physical \"$RELOAD_SLOT_X\" \"$RELOAD_SLOT_Y\" 3\n"
              "adb logcat -d -v brief > \"$WORK/reload-slot-progress.txt\" 2>/dev/null || true\n"
              "if ! grep -qiE 'LoadCareer saveslot:[[:space:]]*0|SETTING ACTIVE:[[:space:]]*gamemenu|SetActive:[[:space:]]*gamemenu' \"$WORK/reload-slot-progress.txt\"; then\n"
              "  press_message_accept 3\n"
              "fi\n"
              "wait_log 'LoadCareer saveslot:[[:space:]]*0|SETTING ACTIVE:[[:space:]]*gamemenu|SetActive:[[:space:]]*gamemenu|Create Screen:[[:space:]]*gamemenu' 30 reload-career\n"
              "wait_log 'SETTING ACTIVE:[[:space:]]*gamemenu|SetActive:[[:space:]]*gamemenu|Create Screen:[[:space:]]*gamemenu' 30 gamemenu\n"
              "shot career-gamemenu\n"
          )
          if old_career not in text:
              raise SystemExit('expected post-career GameMenu wait block not found')
          text = text.replace(old_career, new_career, 1)

          p.write_text(text, encoding='utf-8')
          PY
          bash -n nss_stage3_knockout_runtime.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture ${{ matrix.mode }} stock knockout runtime
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash nss_stage3_knockout_runtime.sh '${{ matrix.mode }}'
      - name: Upload knockout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage3-knockout-${{ matrix.mode }}-public-api29
          path: ${{ runner.temp }}/nss-stage3-knockout-${{ matrix.mode }}/out/
          retention-days: 2
