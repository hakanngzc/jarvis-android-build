name: Stage4 stock runtime diagnostic

on:
  push:
    branches: [stage4-shortest-league-data-20261026]

permissions:
  contents: read

jobs:
  inspect-stock-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified NSS 4.31 and inspect match controls
        run: |
          set -euo pipefail
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          XAPK_SHA='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          BASE_SHA='46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4'
          curl -fL --retry 3 -A 'Mozilla/5.0' -e "$REFERER" "$URL" -o /tmp/nss431.xapk
          echo "$XAPK_SHA  /tmp/nss431.xapk" | sha256sum -c -
          mkdir -p /tmp/xapk
          unzip -q /tmp/nss431.xapk -d /tmp/xapk
          BASE=/tmp/xapk/com.newstargames.newstarsoccer.apk
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          unzip -p "$BASE" assets/monkey/NewGUI/Screens/match.uis > /tmp/match.uis
          echo STAGE4_MATCH_CONTROLS_BEGIN
          grep -nEi 'speed|fast|slow|pause|play|button|gadget|btn_' /tmp/match.uis | head -n 200 || true
          echo STAGE4_MATCH_CONTROLS_END
          echo STAGE4_MATCH_UI_HEAD_BEGIN
          sed -n '1,260p' /tmp/match.uis
          echo STAGE4_MATCH_UI_HEAD_END
