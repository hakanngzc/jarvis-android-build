name: Stage4 shortest league data diagnostic

on:
  push:
    branches: [stage4-shortest-league-data-20261026]

permissions:
  contents: read

jobs:
  inspect-stock-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified NSS 4.31 and inspect initial-page league sizes
        run: |
          set -euo pipefail
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          XAPK_SHA='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          BASE_SHA='46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4'
          curl -fL --retry 3 -A 'Mozilla/5.0' -e "$REFERER" "$URL" -o /tmp/nss431.xapk
          echo "$XAPK_SHA  /tmp/nss431.xapk" | sha256sum -c -
          mkdir -p /tmp/xapk
          unzip -q /tmp/nss431.xapk -d /tmp/xapk
          BASE=/tmp/xapk/com.newstargames.newstarsoccer.apk
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          unzip -p "$BASE" assets/monkey/MyData/v2025/Nations.txt > /tmp/Nations.txt
          unzip -p "$BASE" assets/monkey/MyData/v2025/Competitions.txt > /tmp/Competitions.txt
          unzip -p "$BASE" assets/monkey/MyData/v2025/Clubs.txt > /tmp/Clubs.txt
          python3 - <<'PY'
          import csv
          from collections import Counter

          def rows(path):
              with open(path, encoding='utf-8-sig', errors='replace', newline='') as f:
                  return list(csv.DictReader(f, delimiter='\t'))

          def s(value):
              return '' if value is None else str(value).strip()

          nations = rows('/tmp/Nations.txt')
          comps = rows('/tmp/Competitions.txt')
          clubs = rows('/tmp/Clubs.txt')
          comp_by_id = {s(r.get('id')): r for r in comps if s(r.get('id')).isdigit()}
          wanted = ['Albania','Algeria','Andorra','Angola','Argentina','Armenia']

          print('NATIONS_HEADER', nations[0].keys() if nations else [])
          print('COMPETITIONS_HEADER', comps[0].keys() if comps else [])
          print('CLUBS_HEADER', clubs[0].keys() if clubs else [])
          print('STAGE4_INITIAL_PAGE_LEAGUE_COUNTS_BEGIN')
          for name in wanted:
              matches = [r for r in nations if name.lower() in ' '.join(s(v) for v in r.values()).lower()]
              if not matches:
                  print(name, 'NATION_NOT_FOUND')
                  continue
              nation = matches[0]
              nid = s(nation.get('id'))
              nation_clubs = [r for r in clubs if s(r.get('nationid')) == nid and s(r.get('id')).isdigit() and s(r.get('bteamof')) in ('','0')]
              by_league = Counter(s(r.get('leagueid')) for r in nation_clubs if s(r.get('leagueid')) not in ('','0'))
              league_desc = []
              for lid,count in sorted(by_league.items(), key=lambda kv:(kv[1],kv[0])):
                  cr=comp_by_id.get(lid,{})
                  label = s(cr.get('tla')) or s(cr.get('locale')) or '?'
                  level = s(cr.get('level')) or '?'
                  duration = s(cr.get('duration')) or '?'
                  rounds = s(cr.get('rounds')) or '?'
                  groups = s(cr.get('groups')) or '?'
                  league_desc.append(f'{lid}:{label}:clubs={count}:level={level}:duration={duration}:rounds={rounds}:groups={groups}')
              print(f'{name}\tnation_id={nid}\tclubs={len(nation_clubs)}\tleagues={"|".join(league_desc)}')
          print('STAGE4_INITIAL_PAGE_LEAGUE_COUNTS_END')
          PY
