name: Stage4 shortest league data diagnostic

on:
  push:
    branches: [stage4-shortest-league-data-20261026]

permissions:
  contents: read

jobs:
  inspect-stock-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified NSS 4.31 and inspect league sizes
        run: |
          set -euo pipefail
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          XAPK_SHA='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          BASE_SHA='46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4'
          curl -fL --retry 3 -A 'Mozilla/5.0' -e "$REFERER" "$URL" -o /tmp/nss431.xapk
          echo "$XAPK_SHA  /tmp/nss431.xapk" | sha256sum -c -
          mkdir -p /tmp/xapk
          unzip -q /tmp/nss431.xapk -d /tmp/xapk
          BASE=/tmp/xapk/com.newstargames.newstarsoccer.apk
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          unzip -p "$BASE" assets/monkey/MyData/v2025/Nations.txt > /tmp/Nations.txt
          unzip -p "$BASE" assets/monkey/MyData/v2025/Competitions.txt > /tmp/Competitions.txt
          unzip -p "$BASE" assets/monkey/MyData/v2025/Clubs.txt > /tmp/Clubs.txt
          python3 - <<'PY'
          import csv
          from collections import Counter, defaultdict

          def rows(path):
              with open(path, encoding='utf-8-sig', errors='replace', newline='') as f:
                  return list(csv.DictReader(f, delimiter='\t'))
          def s(v): return '' if v is None else str(v).strip()
          def iv(v, default=0):
              try: return int(s(v))
              except ValueError: return default

          nations=rows('/tmp/Nations.txt'); comps=rows('/tmp/Competitions.txt'); clubs=rows('/tmp/Clubs.txt')
          nation_by_id={s(r.get('id')):r for r in nations if s(r.get('id')).isdigit()}
          comp_by_id={s(r.get('id')):r for r in comps if s(r.get('id')).isdigit()}
          by_nation_league=Counter()
          for r in clubs:
              if not s(r.get('id')).isdigit() or s(r.get('bteamof')) not in ('','0'): continue
              nid,lid=s(r.get('nationid')),s(r.get('leagueid'))
              if nid and lid not in ('','0'): by_nation_league[(nid,lid)] += 1

          wanted=['Albania','Algeria','Andorra','Angola','Argentina','Armenia']
          print('STAGE4_INITIAL_PAGE_LEAGUE_COUNTS_BEGIN')
          for name in wanted:
              matches=[r for r in nations if s(r.get('shortname')).lower()==name.lower()]
              if not matches:
                  print(name,'NATION_NOT_FOUND'); continue
              nid=s(matches[0].get('id'))
              desc=[]
              for (nn,lid),count in by_nation_league.items():
                  if nn != nid: continue
                  cr=comp_by_id.get(lid,{})
                  desc.append((count,lid,s(cr.get('tla')),iv(cr.get('rounds')),iv(cr.get('duration'))))
              print(name,'nation_id='+nid,' '.join(f'{lid}:{tla}:clubs={count}:rounds={rounds}:duration={duration}' for count,lid,tla,rounds,duration in sorted(desc)))
          print('STAGE4_INITIAL_PAGE_LEAGUE_COUNTS_END')

          candidates=[]
          for (nid,lid),count in by_nation_league.items():
              cr=comp_by_id.get(lid,{})
              tla=s(cr.get('tla'))
              rounds=iv(cr.get('rounds'))
              duration=iv(cr.get('duration'))
              if rounds <= 0 or count < 4: continue
              # Main domestic tier convention in stock data is the *1 code.
              if not tla.endswith('1'): continue
              nation=s(nation_by_id.get(nid,{}).get('shortname')) or '?'
              implied=(count-1)*rounds
              candidates.append((implied,duration,count,rounds,nation,nid,lid,tla))
          print('STAGE4_SHORTEST_TOP_LEAGUES_BEGIN')
          for row in sorted(candidates)[:30]:
              implied,duration,count,rounds,nation,nid,lid,tla=row
              print(f'{nation}\tnation_id={nid}\t{tla}\tleague_id={lid}\tclubs={count}\trounds={rounds}\timplied_matches={implied}\tduration={duration}')
          print('STAGE4_SHORTEST_TOP_LEAGUES_END')
          PY
