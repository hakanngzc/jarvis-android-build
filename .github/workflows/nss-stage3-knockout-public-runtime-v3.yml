name: NSS Stage3 Knockout Public Runtime V3

on:
  workflow_dispatch:
  push:
    branches:
      - nss-stage3-knockout-runtime-20261023
    paths:
      - '.github/workflows/nss-stage3-knockout-public-runtime-v3.yml'

permissions:
  contents: read

jobs:
  knockout-runtime-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [extra-time, shootout]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Python image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Validate V2 helper tests
        run: python -m unittest knockout_v2/test_pick_match_play.py -v
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture ${{ matrix.mode }} stock knockout runtime V3
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: export PATH="$ANDROID_HOME/emulator:$PATH"; bash knockout_v2/run_knockout_v2.sh '${{ matrix.mode }}'
      - name: Upload knockout V3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage3-knockout-v3-${{ matrix.mode }}-public-api29
          path: ${{ runner.temp }}/nss-stage3-knockout-${{ matrix.mode }}/out/
          retention-days: 2
