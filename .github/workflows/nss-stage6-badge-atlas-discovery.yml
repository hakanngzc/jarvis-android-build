name: NSS Stage6 Badge Atlas Discovery
on:
  workflow_dispatch:
  push:
    branches: [stage6-badge-atlas-discovery-20261023]
    paths:
      - 'stage6_public/**'
      - '.github/workflows/nss-stage6-badge-atlas-discovery.yml'
permissions:
  contents: read
jobs:
  badge-atlas-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage6 discovery unit contract
        run: |
          set -euo pipefail
          PYTHONPATH=stage6_public python3 -m unittest stage6_public/test_discover_badge_atlas.py stage6_public/test_append_logo_atlas.py stage6_public/test_runtime_fixture_builder.py -v
          python3 -m py_compile stage6_public/discover_badge_atlas.py stage6_public/dump_atlas_manager.py stage6_public/find_badge_writers.py stage6_public/dump_badge_data_flow.py stage6_public/dump_badge_chain.py stage6_public/find_image_load_paths.py stage6_public/inspect_key_tail.py stage6_public/append_logo_atlas.py
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-public/xapk" stage6_public_artifacts
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage6-public/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage6-public/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage6-public/nss431.xapk" -d "$RUNNER_TEMP/stage6-public/xapk"
          BASE="$RUNNER_TEMP/stage6-public/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Discover stock badge and atlas architecture
        run: |
          set -euo pipefail
          python3 stage6_public/discover_badge_atlas.py "$BASE" stage6_public_artifacts
          python3 stage6_public/dump_atlas_manager.py "$BASE" stage6_public_artifacts/atlas-manager-disasm.txt
          python3 stage6_public/find_badge_writers.py "$BASE" stage6_public_artifacts/badge-writers.json
          python3 stage6_public/dump_badge_data_flow.py "$BASE" stage6_public_artifacts/badge-data-flow.txt
          python3 stage6_public/dump_badge_chain.py "$BASE" stage6_public_artifacts/badge-chain-disasm.txt
          python3 stage6_public/find_image_load_paths.py "$BASE" stage6_public_artifacts/image-load-paths.json
          python3 stage6_public/inspect_key_tail.py "$BASE" stage6_public_artifacts/key-tail-layout.json

          unzip -p "$BASE" assets/monkey/NewGUI/Atlases/Key.key > stage6_public_artifacts/stock-Key.key
          cat > stage6_public_artifacts/logo-atlas-spec.json <<'JSON'
          {
            "atlas_name":"UIAtlas145","width":256,"height":128,
            "records":[
              {"name":"REBORNClub3141","original_width":128,"original_height":128,"trimmed_width":128,"trimmed_height":128,"render_data":[0.0,1.0,0.0,1.0,1.0,0.0,0.5,0.0]},
              {"name":"REBORNClub3157","original_width":128,"original_height":128,"trimmed_width":128,"trimmed_height":128,"render_data":[0.0,1.0,0.5,1.0,1.0,0.0,0.0,0.0]}
            ]
          }
          JSON
          # Note: second record's exact spec is independently tested by append tool; this
          # static discovery job only proves binary append preservation. Runtime builder
          # carries the final render coordinates.
          python3 - <<'PY'
          import json
          p='stage6_public_artifacts/logo-atlas-spec.json'
          j=json.load(open(p)); j['records'][1]['render_data']=[0.0,1.0,0.5,1.0,1.0,0.0,1.0,0.0]
          open(p,'w').write(json.dumps(j,indent=2)+'\n')
          PY
          PYTHONPATH=stage6_public python3 stage6_public/append_logo_atlas.py \
            stage6_public_artifacts/stock-Key.key stage6_public_artifacts/Key-with-UIAtlas145.key \
            stage6_public_artifacts/logo-atlas-spec.json stage6_public_artifacts/append-atlas-report.json

          PYTHONPATH=stage6_public python3 - <<'PY'
          import hashlib,json,struct
          from inspect_key_tail import headers,parse_record_end
          stock=open('stage6_public_artifacts/stock-Key.key','rb').read()
          data=open('stage6_public_artifacts/Key-with-UIAtlas145.key','rb').read()
          rep=json.load(open('stage6_public_artifacts/append-atlas-report.json'))
          hs=headers(data)
          assert struct.unpack_from('<I',data,0)[0]==145
          assert len(hs)==145 and hs[-1]['name']=='UIAtlas145'
          assert hs[-1]['width']==256 and hs[-1]['height']==128 and hs[-1]['count']==2
          pos=hs[-1]['records_offset']; names=[]
          for _ in range(2):
              end,meta=parse_record_end(data,pos); assert end and meta['layout']=='normal' and meta['flags']==0
              names.append(meta['name']); pos=end
          assert names==['REBORNClub3141','REBORNClub3157']
          assert rep['insert_offset']==768320
          assert rep['old_atlas_count']==144 and rep['new_atlas_count']==145
          assert rep['alias_suffix_sha256_before']==rep['alias_suffix_sha256_after']
          assert rep['source_prefix_sha256']==rep['patched_prefix_sha256']
          assert hashlib.sha256(stock[rep['insert_offset']:]).hexdigest()==rep['alias_suffix_sha256_before']
          print('EXACT_STOCK_ATLAS_APPEND=PASS')
          PY

          python3 - <<'PY'
          import json
          p=json.load(open('stage6_public_artifacts/stage6-badge-atlas-discovery.json',encoding='utf-8'))
          shield=[x for x in p['atlas_symbols'] if x['name'].startswith('MapShield')]
          assert len(shield)==19, len(shield)
          assert all(x['flags']==8 and x['record_layout']=='stripped_triangles' for x in shield)
          assert all(x['sentinel_found'] and x['triangle_count']>0 and not x['contiguous_atlas_box'] for x in shield)
          assert p['clubs']['fields']
          text=open('stage6_public_artifacts/atlas-manager-disasm.txt',encoding='utf-8').read()
          assert 'name=m_ReadStrippedImage' in text
          w=json.load(open('stage6_public_artifacts/badge-writers.json',encoding='utf-8'))
          assert w['field_candidates']
          flow=open('stage6_public_artifacts/badge-data-flow.txt',encoding='utf-8').read()
          assert 'm_badgestyle' in flow and 'm_SetUpTeamShield' in flow and 'BadgeStyle1' in flow
          chain=open('stage6_public_artifacts/badge-chain-disasm.txt',encoding='utf-8').read()
          assert 'CLASS=Lcom/newstargames/newstarsoccer/c_ImageAsset;' in chain
          assert 'name=m_CreateClub' in chain and 'name=m_GetAtlasedImage' in chain
          paths=json.load(open('stage6_public_artifacts/image-load-paths.json',encoding='utf-8'))
          assert paths['hits']
          tail=json.load(open('stage6_public_artifacts/key-tail-layout.json',encoding='utf-8'))
          assert tail['atlas_count_prefix']==144 and tail['header_count_found']==144
          assert tail['last_atlas']['name']=='UIAtlas144'
          assert tail['parsed_all_last_atlas_records'] and tail['parsed_record_count']==278
          assert tail['alias_probe']['offset']==768320
          print('VERDICT=STAGE6_BADGE_ATLAS_DISCOVERY_PASS')
          PY
      - name: Upload Stage6 discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage6-badge-atlas-discovery
          path: stage6_public_artifacts/**
