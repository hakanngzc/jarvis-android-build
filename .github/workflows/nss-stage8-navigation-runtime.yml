name: NSS Stage8 Navigation Runtime

on:
  workflow_dispatch:
  push:
    branches: [stage8-navigation-20261026]

permissions:
  contents: read

jobs:
  navigation-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Stage7 and Stage8 runtime tooling
        run: |
          python3 -m unittest test_stage7_runtime_probe.py test_stage7_runtime_gate.py test_stage8_age_unlock.py test_stage8_lifecycle_verifier.py test_stage8_navigation_gate.py -v
          python3 -m py_compile stage8_tools/patch_stage8_age_unlock.py stage8_tools/verify_stage8_lifecycle.py
          bash -n stage7_runtime_gate.sh
          bash -n stage8_navigation_gate.sh

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 10 and verify Stage8 navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            bash stage7_runtime_gate.sh
            bash stage8_navigation_gate.sh

      - name: Upload Stage8 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage8-navigation-runtime-evidence
          path: |
            ${{ runner.temp }}/stage8-navigation/
            ${{ runner.temp }}/stage7-persistence/STAGE7_PERSISTENCE_GATE.txt
          retention-days: 7
