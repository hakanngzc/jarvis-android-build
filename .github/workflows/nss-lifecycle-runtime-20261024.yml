name: NSS Lifecycle Runtime 20261024

on:
  workflow_dispatch:
  push:
    branches:
      - nss-residual-static-20261024
    paths:
      - '.github/workflows/nss-lifecycle-runtime-20261024.yml'
      - 'lifecycle/**'

permissions:
  contents: read

jobs:
  lifecycle-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Python image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Validate lifecycle probe transform
        working-directory: lifecycle
        run: python3 -m unittest test_patch_lifecycle_probe.py test_patch_lifecycle_probe_v2.py test_patch_lifecycle_probe_v3.py test_patch_lifecycle_probe_v4.py test_patch_lifecycle_probe_v5.py test_patch_lifecycle_probe_v6.py test_patch_lifecycle_probe_v7.py test_patch_lifecycle_probe_v8.py test_match_navigation_state.py test_preserve_egl_activity_patch.py test_gl_resume_race_patch.py test_gl_context_survival_patch.py test_activity_super_lifecycle_patch.py -v
      - name: Derive lifecycle probe from proven Stage3 runtime driver
        run: |
          python3 lifecycle/patch_lifecycle_probe_v8.py \
            nss_stage3_knockout_runtime.sh lifecycle/run_lifecycle_probe.sh
          bash -n lifecycle/run_lifecycle_probe.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run stock NSS lifecycle probe on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: LIFECYCLE_API='${{ matrix.api-level }}' bash lifecycle/run_lifecycle_probe.sh extra-time
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-lifecycle-api${{ matrix.api-level }}-20261024
          path: ${{ runner.temp }}/nss-stage3-knockout-extra-time/out/
          retention-days: 30
