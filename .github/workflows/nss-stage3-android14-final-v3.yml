name: NSS Stage3 Android14 Final V3

on:
  push:
    branches:
      - stage3-android14-final-v3-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android14-final-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Stage3 final regressions
        run: |
          python3 -m unittest \
            test_stage3_harness_hardening.py \
            test_stage3_runtime_state_patch.py \
            test_stage3_restart_hardening.py \
            test_stage3_fast_match_fulltime.py \
            test_stage3_reload_autoload.py -v
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 14 and verify full hardened Stage3 lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: |
            python3 stage3_runtime_hotfix.py
            python3 stage3_career_input_retry_patch.py
            python3 stage3_readiness_patch.py
            python3 stage3_match_flow_patch.py
            python3 stage3_match_button_target_patch.py
            python3 stage3_reload_autoload_patch.py
            python3 stage3_runtime_state_patch.py
            bash -n stage3_minimal_gate.sh
            bash stage3_minimal_gate.sh
            grep -qiE 'USE player\.matchReviewBuxAwarded|Award Currency' "$RUNNER_TEMP/stage3-minimal/STAGE3_RUNTIME_FLOW.log"
            echo 'STAGE3_ANDROID14_WEEKLY_REPORT_SIGNAL_PASS'
      - name: Upload Android14 Stage3 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-android14-final-v3-evidence
          path: ${{ runner.temp }}/stage3-minimal/
          retention-days: 1
