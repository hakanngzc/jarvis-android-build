name: NSS Stage6 Logo Runtime
on:
  workflow_dispatch:
  push:
    branches: [stage6-badge-atlas-discovery-20261023]
    paths:
      - 'stage6_public/append_logo_atlas.py'
      - 'stage6_public/inspect_key_tail.py'
      - 'stage6_public/build_runtime_fixture.py'
      - 'stage6_public/runtime_logo_gate.sh'
      - 'stage6_public/runtime_logo_gate_v2.sh'
      - 'stage6_public/verify_logo_render.py'
      - 'stage6_public/test_verify_logo_render.py'
      - 'stage6_public/patch_club_badge_override.py'
      - 'stage6_public/apply_club_badge_override_dex.sh'
      - '.github/workflows/nss-stage6-logo-runtime.yml'
permissions:
  contents: read
concurrency:
  group: nss-stage6-logo-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logo-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Stage6 runtime harness
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          PYTHONPATH=stage6_public python3 -m unittest \
            stage6_public/test_discover_badge_atlas.py \
            stage6_public/test_append_logo_atlas.py \
            stage6_public/test_runtime_fixture_builder.py \
            stage6_public/test_patch_club_badge_override.py \
            stage6_public/test_verify_logo_render.py -v
          python3 -m py_compile \
            stage6_public/inspect_key_tail.py \
            stage6_public/append_logo_atlas.py \
            stage6_public/build_runtime_fixture.py \
            stage6_public/patch_club_badge_override.py \
            stage6_public/verify_logo_render.py
          bash -n stage6_public/apply_club_badge_override_dex.sh
          bash -n stage6_public/runtime_logo_gate.sh
          bash -n stage6_public/runtime_logo_gate_v2.sh
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-runtime/xapk" stage6_public_artifacts/runtime
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage6-runtime/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage6-runtime/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage6-runtime/nss431.xapk" -d "$RUNNER_TEMP/stage6-runtime/xapk"
          BASE="$RUNNER_TEMP/stage6-runtime/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "STOCK_XAPK_DIR=$RUNNER_TEMP/stage6-runtime/xapk" >> "$GITHUB_ENV"
      - name: Download pinned smali toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-tools"
          BAK="$RUNNER_TEMP/stage6-tools/baksmali-3.0.10-fat.jar"
          SMA="$RUNNER_TEMP/stage6-tools/smali-3.0.10-fat.jar"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar' -o "$BAK"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar' -o "$SMA"
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  '"$BAK" | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  '"$SMA" | sha256sum -c -
          java -jar "$BAK" --version | tee stage6_public_artifacts/runtime/baksmali-version.txt
          java -jar "$SMA" --version | tee stage6_public_artifacts/runtime/smali-version.txt
          echo "BAKSMALI_JAR=$BAK" >> "$GITHUB_ENV"
          echo "SMALI_JAR=$SMA" >> "$GITHUB_ENV"
      - name: Preflight exact stock DEX override
        run: |
          set -euo pipefail
          bash stage6_public/apply_club_badge_override_dex.sh \
            "$BASE" "$RUNNER_TEMP/stage6-preflight.apk" "$RUNNER_TEMP/stage6-preflight-work" \
            stage6_public_artifacts/runtime/preflight-badge-dex-report.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run multi-logo Android runtime proof
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash stage6_public/runtime_logo_gate.sh
      - name: Require Stage6 runtime verdict
        run: |
          set -euo pipefail
          G=stage6_public_artifacts/runtime/stage6-logo-gates.txt
          grep -q '^STAGE6_DEX_OVERRIDE=PASS$' "$G"
          grep -q '^STAGE6_FIXTURE_BUILD=PASS$' "$G"
          grep -q '^STAGE6_FIXTURE_STATIC=PASS$' "$G"
          grep -q '^STAGE6_FIXTURE_INSTALLED=PASS$' "$G"
          grep -q '^STAGE6_MULTI_CLUB_RENDER=PASS$' "$G"
          grep -q '^STAGE6_CLUB3141_IDENTITY=PASS$' "$G"
          grep -q '^STAGE6_CLUB3157_IDENTITY=PASS$' "$G"
          grep -q '^STAGE6_STOCK_BADGE_FALLBACK_RENDER=PASS$' "$G"
          grep -q '^STAGE6_RUNTIME_STABILITY=PASS$' "$G"
          grep -q '^STAGE6_LOGO_ATLAS_RUNTIME=PASS$' "$G"
          test -s stage6_public_artifacts/runtime/multi-logo-runtime.png
          python3 - <<'PY'
          import json
          p=json.load(open('stage6_public_artifacts/runtime/runtime-fixture-report.json',encoding='utf-8'))
          d=json.load(open('stage6_public_artifacts/runtime/badge-dex-report.json',encoding='utf-8'))
          assert d['other_dex_preserved'] is True
          assert d['classes3_sha256_before'] != d['classes3_sha256_after']
          assert d['override']['fallback']=='m_id % 15'
          assert d['override']['overrides']=={'3141':16,'3157':17}
          assert p['append']['old_atlas_count']==144 and p['append']['new_atlas_count']==145
          assert p['append']['alias_suffix_sha256_before']==p['append']['alias_suffix_sha256_after']
          assert p['selector']['stock_design15_count_before']==p['selector']['stock_design15_count_after']
          assert p['selector']['selector_insert_count']>=6
          assert p['runtime_symbols']==['REBORNClub3141','REBORNClub3157','MapShieldDesign6']
          print('VERDICT=STAGE6_PUBLIC_LOGO_RUNTIME_PASS')
          PY
      - name: Upload Stage6 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage6-logo-runtime
          path: stage6_public_artifacts/runtime/**
