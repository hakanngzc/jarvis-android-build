name: Build VoxelCraft APK
on:
  push:
    branches: [ "voxelcraft-v0.3" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Bundle signing tools for local secure signing
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-v0.3-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
