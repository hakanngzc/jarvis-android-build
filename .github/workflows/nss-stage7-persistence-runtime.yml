name: NSS Stage7 Persistence Runtime

on:
  workflow_dispatch:
  push:
    branches: [stage7-runtime-20261025]
    paths:
      - '.github/workflows/nss-stage7-persistence-runtime.yml'
      - 'stage7_persistence_gate.sh'
      - 'stage7_tools/**'
      - 'test_stage7_*.py'

permissions:
  contents: read

jobs:
  persistence-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Stage7 tooling
        run: |
          python3 -m unittest test_stage7_runtime_probe.py test_stage7_runtime_verifier.py test_stage7_gate_shell.py -v
          python3 -m py_compile stage7_tools/patch_stage7_persistence_probe.py stage7_tools/verify_stage7_persistence_runtime.py
          bash -n stage7_persistence_gate.sh

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Boot Android 10 and verify Stage7 persistence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            bash stage7_persistence_gate.sh

      - name: Upload Stage7 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage7-persistence-runtime-evidence
          path: ${{ runner.temp }}/stage7-persistence/
          retention-days: 3
