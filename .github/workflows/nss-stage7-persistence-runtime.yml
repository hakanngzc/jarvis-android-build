name: NSS Stage7 Persistent Subsystems Runtime
on:
  workflow_dispatch:
  push:
    branches: [stage7-persistent-subsystems-20261024]
    paths:
      - 'stage7_public/**'
      - 'stage1_public/patch_career_test_hook.py'
      - 'stage1_public/patch_cloud_startup_bypass_for_persistence_test.py'
      - 'stage1_public/stock_ui_coords.py'
      - '.github/workflows/nss-stage7-persistence-runtime.yml'
permissions:
  contents: read
concurrency:
  group: nss-stage7-persistence-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  persistent-subsystems-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Stage7 runtime harness
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          PYTHONPATH=stage7_public python3 -m unittest \
            stage7_public/test_persistence_fixture_patch.py \
            stage7_public/test_verify_player_tokens.py -v
          python3 -m py_compile \
            stage7_public/persistence_fixture_patch.py \
            stage7_public/verify_player_tokens.py
          bash -n stage7_public/apply_persistence_fixture_dex.sh
          bash -n stage7_public/runtime_persistence_gate.sh
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage7-runtime/xapk" stage7_public_artifacts/runtime
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage7-runtime/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage7-runtime/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage7-runtime/nss431.xapk" -d "$RUNNER_TEMP/stage7-runtime/xapk"
          BASE="$RUNNER_TEMP/stage7-runtime/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "STOCK_XAPK_DIR=$RUNNER_TEMP/stage7-runtime/xapk" >> "$GITHUB_ENV"
      - name: Download pinned smali toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage7-tools"
          BAK="$RUNNER_TEMP/stage7-tools/baksmali-3.0.10-fat.jar"
          SMA="$RUNNER_TEMP/stage7-tools/smali-3.0.10-fat.jar"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar' -o "$BAK"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar' -o "$SMA"
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  '"$BAK" | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  '"$SMA" | sha256sum -c -
          java -jar "$BAK" --version | tee stage7_public_artifacts/runtime/baksmali-version.txt
          java -jar "$SMA" --version | tee stage7_public_artifacts/runtime/smali-version.txt
          echo "BAKSMALI_JAR=$BAK" >> "$GITHUB_ENV"
          echo "SMALI_JAR=$SMA" >> "$GITHUB_ENV"
      - name: Preflight exact stock save/load fixture patches
        run: |
          set -euo pipefail
          python3 stage1_public/patch_career_test_hook.py "$BASE" "$RUNNER_TEMP/stage7-preflight-career.apk" | tee stage7_public_artifacts/runtime/preflight-career-hook.txt
          python3 stage1_public/patch_cloud_startup_bypass_for_persistence_test.py \
            "$RUNNER_TEMP/stage7-preflight-career.apk" "$RUNNER_TEMP/stage7-preflight-harness.apk" | tee stage7_public_artifacts/runtime/preflight-cloud-harness.txt
          bash stage7_public/apply_persistence_fixture_dex.sh \
            "$RUNNER_TEMP/stage7-preflight-harness.apk" "$RUNNER_TEMP/stage7-preflight-mutator.apk" "$RUNNER_TEMP/stage7-preflight-mutator-work" mutator \
            stage7_public_artifacts/runtime/preflight-mutator-dex-report.json
          bash stage7_public/apply_persistence_fixture_dex.sh \
            "$RUNNER_TEMP/stage7-preflight-harness.apk" "$RUNNER_TEMP/stage7-preflight-verifier.apk" "$RUNNER_TEMP/stage7-preflight-verifier-work" verifier \
            stage7_public_artifacts/runtime/preflight-verifier-dex-report.json
          python3 - <<'PY'
          import json
          for mode in ('mutator','verifier'):
              p=json.load(open(f'stage7_public_artifacts/runtime/preflight-{mode}-dex-report.json',encoding='utf-8'))
              assert p['mode']==mode
              assert p['other_dex_preserved'] is True
              assert p['classes3_sha256_before']!=p['classes3_sha256_after']
              assert p['patch']['method']==('p_SaveCareer' if mode=='mutator' else 'm_LoadCareer')
          print('STAGE7_EXACT_DEX_PREFLIGHT=PASS')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Stage7 save-load-resave Android proof
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash stage7_public/runtime_persistence_gate.sh
      - name: Require Stage7 runtime verdict
        run: |
          set -euo pipefail
          G=stage7_public_artifacts/runtime/stage7-gates.txt
          grep -q '^STAGE7_FIXTURE_DEX=PASS$' "$G"
          grep -q '^STAGE7_FIXTURE_BUILD=PASS$' "$G"
          grep -q '^STAGE7_MUTATOR_INSTALLED=PASS$' "$G"
          grep -q '^STAGE7_MUTATOR_SAVE=PASS$' "$G"
          grep -q '^STAGE7_MUTATED_TOKENS=PASS$' "$G"
          grep -q '^STAGE7_VERIFIER_UPDATE=PASS$' "$G"
          grep -q '^STAGE7_LOAD_THEN_RESAVE_LOG=PASS$' "$G"
          grep -q '^STAGE7_SAVE_LOAD_RESAVE=PASS$' "$G"
          grep -q '^STAGE7_ECONOMY_RUNTIME=PASS$' "$G"
          grep -q '^STAGE7_CONTRACT_RUNTIME=PASS$' "$G"
          grep -q '^STAGE7_RELATION_LIFESTYLE_RUNTIME=PASS$' "$G"
          grep -q '^STAGE7_SKILL_TRAINING_RUNTIME=PASS$' "$G"
          grep -q '^STAGE7_RUNTIME_STABILITY=PASS$' "$G"
          grep -q '^STAGE7_PERSISTENT_SUBSYSTEMS_RUNTIME=PASS$' "$G"
          test -s stage7_public_artifacts/runtime/mutated-save.xml
          test -s stage7_public_artifacts/runtime/post-load-resave.xml
          python3 - <<'PY'
          import json
          p=json.load(open('stage7_public_artifacts/runtime/save-load-resave-token-report.json',encoding='utf-8'))
          assert p['pass'] is True
          assert p['changed']=={}
          assert p['before']['values']['35']=='4321'
          assert p['after']['values']['35']=='4321'
          assert p['before']['values']['34']=='321'
          assert p['after']['values']['34']=='321'
          print('VERDICT=STAGE7_PUBLIC_PERSISTENT_SUBSYSTEMS_RUNTIME_PASS')
          PY
      - name: Upload Stage7 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage7-persistent-subsystems-runtime
          path: stage7_public_artifacts/runtime/**
