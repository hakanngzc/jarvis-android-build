name: NSS Stage4 Stability Candidate Validation

on:
  push:
    branches: [stage4-production-stability-candidate-20261027]

permissions:
  contents: read

jobs:
  validate-stage4-stability-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate composed Stage4 stability candidate
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_transport_death.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py stage4_tools/validate_frame_png.py stage4_tools/find_league_picker.py stage4_tools/find_dilemma_choice.py stage4_tools/find_live_ball.py stage4_tools/find_kick_ball.py stage4_tools/find_match_resume.py stage4_tools/find_match_speed.py stage4_tools/classify_live_frame.py stage4_tools/verify_stage4_natural_season.py
          bash -n stage4_natural_season_gate.sh stage4_tools/run_stage4_natural_gate.sh
          python3 -m unittest test_stage4_transport_death_policy.py test_stage4_emulator_pin_policy.py test_stage4_natural_policy.py test_stage4_timeout_budget.py test_stage4_offline_runtime.py test_stage4_short_league.py test_stage4_event_navigation.py test_stage4_bux_shopoverlay_run270.py test_stage4_live_ball_driver.py test_stage4_match_speed.py test_stage4_live_input_speed.py test_stage4_single_decode_classifier.py test_stage4_boundary_scope.py test_stage4_match_resolution.py test_stage2_residual_contract.py test_chooseclub_step_targets.py test_runtime_start_retry.py -v
