name: NSS Stage0 Public Payload Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - stage0-fingerprint-public-20261022
    paths:
      - '.github/workflows/nss-stage0-public-payload-manifest.yml'

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified public stock and emit text-only payload manifest
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/stage0-public-payload"
          OUT="$WORK/out"
          mkdir -p "$WORK/xapk" "$OUT"
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          EXPECTED='afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$WORK/stock.xapk"
          echo "$EXPECTED  $WORK/stock.xapk" | sha256sum -c -
          unzip -q "$WORK/stock.xapk" -d "$WORK/xapk"
          sdkmanager --install 'build-tools;37.0.0' >/dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          python3 - "$WORK/stock.xapk" "$WORK/xapk" "$APKSIGNER" "$OUT/public-payload-manifest.json" <<'PY'
          import hashlib, json, re, subprocess, sys, zipfile
          from pathlib import Path
          xapk, root, apksigner, out = map(Path, sys.argv[1:])
          def h(b): return hashlib.sha256(b).hexdigest()
          def fh(p):
              q=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024), b''): q.update(c)
              return q.hexdigest()
          sig_re=re.compile(r'(?i)^META-INF/(?:[^/]+\.(?:SF|RSA|DSA|EC)|MANIFEST\.MF)$')
          data={
              'xapk_sha256': fh(xapk),
              'xapk_size': xapk.stat().st_size,
              'manifest_sha256': fh(root/'manifest.json'),
              'apks': []
          }
          for apk in sorted(root.glob('*.apk')):
              p=subprocess.run([str(apksigner),'verify','--verbose','--print-certs',str(apk)],text=True,capture_output=True,check=True)
              text=(p.stdout or '')+'\n'+(p.stderr or '')
              c256=re.search(r'(?im)^.*Signer.*certificate SHA-256 digest:\s*([0-9a-f]{64})\s*$',text)
              c1=re.search(r'(?im)^.*Signer.*certificate SHA-1 digest:\s*([0-9a-f]{40})\s*$',text)
              dn=re.search(r'(?im)^.*Signer.*certificate DN:\s*(.+?)\s*$',text)
              entries=[]
              with zipfile.ZipFile(apk) as z:
                  for i in z.infolist():
                      if i.is_dir() or sig_re.match(i.filename):
                          continue
                      b=z.read(i.filename)
                      entries.append({'name':i.filename,'size':len(b),'sha256':h(b)})
              data['apks'].append({
                  'name':apk.name,
                  'size':apk.stat().st_size,
                  'sha256':fh(apk),
                  'signer_sha256':c256.group(1).lower() if c256 else None,
                  'signer_sha1':c1.group(1).lower() if c1 else None,
                  'signer_dn':dn.group(1).strip() if dn else None,
                  'payload_entries':entries,
              })
          out.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print('XAPK_SHA256='+data['xapk_sha256'])
          print('APK_COUNT='+str(len(data['apks'])))
          for a in data['apks']:
              print(a['name'],a['sha256'],a['signer_sha256'],len(a['payload_entries']))
          PY
      - name: Upload text-only manifest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage0-public-payload-manifest
          path: ${{ runner.temp }}/stage0-public-payload/out/public-payload-manifest.json
          retention-days: 1
