name: NSS Stage6 Real Logo Runtime
on:
  workflow_dispatch:
  push:
    branches: [stage6-real-logo-runtime-20261023]
    paths:
      - 'stage1_public/**'
      - 'stage6_public/**'
      - 'stage6_runtime/**'
      - '.github/workflows/nss-stage6-real-logo-runtime.yml'
permissions:
  contents: read
jobs:
  real-logo-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage6 fixture patcher tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          PYTHONPATH=stage6_runtime python3 -m unittest stage6_runtime/test_stage6_patchers.py stage6_runtime/test_verify_fixture_apk.py -v
