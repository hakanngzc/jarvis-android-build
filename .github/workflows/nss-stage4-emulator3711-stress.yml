name: NSS Stage4 Emulator 37.1.11 Stress

on:
  push:
    branches: [stage4-emulator3711-stress-20261027]

permissions:
  contents: read

jobs:
  stage4-emulator3711-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate pinned-emulator stress tooling
        run: |
          python3 -m py_compile stage2_residual_tools/prepare_stage2_gate.py stage2_residual_tools/prepare_runtime_start_retry.py stage2_residual_tools/prepare_chooseclub_visual.py stage4_tools/prepare_stage4_offline_runtime.py stage4_tools/prepare_stage4_short_league.py stage4_tools/prepare_stage4_event_navigation.py stage4_tools/prepare_stage4_prematch.py stage4_tools/prepare_stage4_live_input.py stage4_tools/prepare_stage4_transport_death.py stage4_tools/prepare_stage4_match_speed.py stage4_tools/prepare_stage4_boundary_scope.py stage4_tools/prepare_stage4_match_resolution.py stage4_tools/validate_frame_png.py stage4_tools/find_league_picker.py stage4_tools/find_dilemma_choice.py stage4_tools/find_live_ball.py stage4_tools/find_kick_ball.py stage4_tools/find_match_resume.py stage4_tools/find_match_speed.py stage4_tools/classify_live_frame.py
          bash -n stage4_natural_season_gate.sh stage4_tools/run_stage4_natural_gate.sh stage4_tools/run_stage4_cycle10_diagnostic.sh
          python3 -m unittest test_stage4_transport_death_policy.py test_stage4_natural_policy.py test_stage4_timeout_budget.py test_stage4_offline_runtime.py test_stage4_short_league.py test_stage4_event_navigation.py test_stage4_bux_shopoverlay_run270.py test_stage4_live_ball_driver.py test_stage4_match_speed.py test_stage4_live_input_speed.py test_stage4_single_decode_classifier.py test_stage4_boundary_scope.py test_stage4_match_resolution.py test_stage2_residual_contract.py test_chooseclub_step_targets.py test_runtime_start_retry.py -v

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Run ten natural matches on emulator 37.1.11
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MIN_PROGRESS_DAYS: '0'
          MIN_MATCH_CYCLES: '10'
          MIN_WALL_SECONDS: '0'
          MAX_MATCH_CYCLES: '10'
          MATCH_TIMEOUT_SECONDS: '900'
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-build: 15917651
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "10"
            python3 stage2_residual_tools/prepare_stage2_gate.py stage4_natural_season_gate.sh "$RUNNER_TEMP/stage4-cycle10.pre.sh"
            python3 stage2_residual_tools/prepare_runtime_start_retry.py "$RUNNER_TEMP/stage4-cycle10.pre.sh" "$RUNNER_TEMP/stage4-cycle10.start.sh"
            python3 stage2_residual_tools/prepare_chooseclub_visual.py "$RUNNER_TEMP/stage4-cycle10.start.sh" "$RUNNER_TEMP/stage4-cycle10.visual.sh"
            python3 stage4_tools/prepare_stage4_offline_runtime.py "$RUNNER_TEMP/stage4-cycle10.visual.sh" "$RUNNER_TEMP/stage4-cycle10.offline.sh"
            python3 stage4_tools/prepare_stage4_short_league.py "$RUNNER_TEMP/stage4-cycle10.offline.sh" "$RUNNER_TEMP/stage4-cycle10.shortleague.sh"
            python3 stage4_tools/prepare_stage4_event_navigation.py "$RUNNER_TEMP/stage4-cycle10.shortleague.sh" "$RUNNER_TEMP/stage4-cycle10.events.sh"
            python3 stage4_tools/prepare_stage4_prematch.py "$RUNNER_TEMP/stage4-cycle10.events.sh" "$RUNNER_TEMP/stage4-cycle10.prematch.sh"
            python3 stage4_tools/prepare_stage4_live_input.py "$RUNNER_TEMP/stage4-cycle10.prematch.sh" "$RUNNER_TEMP/stage4-cycle10.live.sh"
            python3 stage4_tools/prepare_stage4_transport_death.py "$RUNNER_TEMP/stage4-cycle10.live.sh" "$RUNNER_TEMP/stage4-cycle10.transport.sh"
            python3 stage4_tools/prepare_stage4_match_speed.py "$RUNNER_TEMP/stage4-cycle10.transport.sh" "$RUNNER_TEMP/stage4-cycle10.speed.sh"
            python3 stage4_tools/prepare_stage4_boundary_scope.py "$RUNNER_TEMP/stage4-cycle10.speed.sh" "$RUNNER_TEMP/stage4-cycle10.boundary.sh"
            python3 stage4_tools/prepare_stage4_match_resolution.py "$RUNNER_TEMP/stage4-cycle10.boundary.sh" "$RUNNER_TEMP/stage4-cycle10.final.sh"
            bash -n "$RUNNER_TEMP/stage4-cycle10.final.sh"
            bash stage4_tools/run_stage4_cycle10_diagnostic.sh "$RUNNER_TEMP/stage4-cycle10.final.sh"

      - name: Upload emulator 37.1.11 stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage4-emulator3711-cycle10-evidence
          path: ${{ runner.temp }}/stage4-natural/
          retention-days: 7
