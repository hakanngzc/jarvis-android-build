name: NSS Stage6 Density Split Matrix
on:
  workflow_dispatch:
  push:
    branches: [stage6-density-split-matrix-20261029]
    paths:
      - 'stage6_public/density_matrix_contract.py'
      - 'stage6_public/test_density_matrix_contract.py'
      - 'stage6_public/runtime_logo_density_gate.sh'
      - '.github/workflows/nss-stage6-density-split-matrix.yml'
permissions:
  contents: read
concurrency:
  group: nss-stage6-density-split-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  density-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: tvdpi
            api: 29
            dpi: 213
            density_split: config.tvdpi.apk
            language_split: config.tr.apk
          - case: xhdpi
            api: 29
            dpi: 320
            density_split: config.xhdpi.apk
            language_split: config.en.apk
          - case: xxhdpi
            api: 34
            dpi: 480
            density_split: config.xxhdpi.apk
            language_split: config.tr.apk
          - case: xxxhdpi
            api: 34
            dpi: 640
            density_split: config.xxxhdpi.apk
            language_split: ''
    env:
      STAGE6_MATRIX_CASE: ${{ matrix.case }}
      STAGE6_MATRIX_API: ${{ matrix.api }}
      STAGE6_MATRIX_DPI: ${{ matrix.dpi }}
      STAGE6_DENSITY_SPLIT: ${{ matrix.density_split }}
      STAGE6_LANGUAGE_SPLIT: ${{ matrix.language_split }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate density matrix harness
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          PYTHONPATH=stage6_public python3 -m unittest stage6_public/test_density_matrix_contract.py -v
          python3 -m py_compile stage6_public/density_matrix_contract.py stage6_public/verify_logo_render.py
          bash -n stage6_public/runtime_logo_density_gate.sh
          bash -n stage6_public/runtime_logo_gate_v2.sh
          python3 stage6_public/density_matrix_contract.py \
            "$STAGE6_MATRIX_CASE" "$STAGE6_MATRIX_API" "$STAGE6_MATRIX_DPI" \
            "$STAGE6_DENSITY_SPLIT" "$STAGE6_LANGUAGE_SPLIT"
      - name: Download exact publisher-stock NSS 4.31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-density/xapk" stage6_public_artifacts/runtime
          URL='https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137'
          REFERER='https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31'
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' -e "$REFERER" "$URL" -o "$RUNNER_TEMP/stage6-density/nss431.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$RUNNER_TEMP/stage6-density/nss431.xapk" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stage6-density/nss431.xapk" -d "$RUNNER_TEMP/stage6-density/xapk"
          BASE="$RUNNER_TEMP/stage6-density/xapk/com.newstargames.newstarsoccer.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$BASE" | sha256sum -c -
          test -f "$RUNNER_TEMP/stage6-density/xapk/$STAGE6_DENSITY_SPLIT"
          if [ -n "$STAGE6_LANGUAGE_SPLIT" ]; then test -f "$RUNNER_TEMP/stage6-density/xapk/$STAGE6_LANGUAGE_SPLIT"; fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "STOCK_XAPK_DIR=$RUNNER_TEMP/stage6-density/xapk" >> "$GITHUB_ENV"
      - name: Download pinned smali toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-density/tools"
          BAK="$RUNNER_TEMP/stage6-density/tools/baksmali-3.0.10-fat.jar"
          SMA="$RUNNER_TEMP/stage6-density/tools/smali-3.0.10-fat.jar"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar' -o "$BAK"
          curl -fL --retry 3 'https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar' -o "$SMA"
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  '"$BAK" | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  '"$SMA" | sha256sum -c -
          echo "BAKSMALI_JAR=$BAK" >> "$GITHUB_ENV"
          echo "SMALI_JAR=$SMA" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run density-specific multi-logo proof
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          disable-spellchecker: true
          script: bash stage6_public/runtime_logo_density_gate.sh
      - name: Require density runtime verdict
        run: |
          set -euo pipefail
          G=stage6_public_artifacts/runtime/stage6-logo-gates.txt
          grep -q '^STAGE6_FIXTURE_INSTALLED=PASS$' "$G"
          grep -q '^STAGE6_MULTI_CLUB_RENDER=PASS$' "$G"
          grep -q '^STAGE6_CLUB3141_IDENTITY=PASS$' "$G"
          grep -q '^STAGE6_CLUB3157_IDENTITY=PASS$' "$G"
          grep -q '^STAGE6_STOCK_BADGE_FALLBACK_RENDER=PASS$' "$G"
          grep -q '^STAGE6_RUNTIME_STABILITY=PASS$' "$G"
          grep -q '^STAGE6_LOGO_ATLAS_RUNTIME=PASS$' "$G"
          grep -q '^STAGE6_DENSITY_MATRIX_CASE=PASS$' "$G"
          grep -q "^STAGE6_DENSITY_MATRIX_API=$STAGE6_MATRIX_API$" "$G"
          grep -q "^STAGE6_DENSITY_MATRIX_DPI=$STAGE6_MATRIX_DPI$" "$G"
          grep -q "^STAGE6_DENSITY_MATRIX_DENSITY_SPLIT=$STAGE6_DENSITY_SPLIT$" "$G"
          test -s stage6_public_artifacts/runtime/multi-logo-runtime.png
          test -s stage6_public_artifacts/runtime/density-matrix-case.json
          echo "STAGE6_DENSITY_SPLIT_RUNTIME_VERDICT=PASS case=$STAGE6_MATRIX_CASE"
      - name: Upload density runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-stage6-density-${{ matrix.case }}
          path: stage6_public_artifacts/runtime/**
