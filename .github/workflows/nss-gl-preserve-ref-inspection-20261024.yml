name: NSS GL Preserve Ref Inspection 20261024

on:
  workflow_dispatch:
  push:
    branches:
      - nss-residual-static-20261024
    paths:
      - '.github/workflows/nss-gl-preserve-ref-inspection-20261024.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch verified stock NSS and inspect GLSurfaceView refs
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nss-gl-preserve"; mkdir -p "$WORK/out" "$WORK/dex"
          curl -fL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36' \
            -e 'https://apkpure.net/new-star-soccer/com.newstargames.newstarsoccer/download/4.31' \
            'https://d.apkpure.net/b/XAPK/com.newstargames.newstarsoccer?versionCode=137' -o "$WORK/stock.xapk"
          echo 'afa4c3319e275de558da7a1c253dec84964094b0a4c1cb2ad557f53dbaf5b57e  '"$WORK/stock.xapk" | sha256sum -c -
          unzip -p "$WORK/stock.xapk" com.newstargames.newstarsoccer.apk > "$WORK/base.apk"
          echo '46b5577b464b35c7122c3cf9737c6a7887ae28bb0911c7687b8b433ea6880aa4  '"$WORK/base.apk" | sha256sum -c -
          python3 - "$WORK/base.apk" "$WORK/out/GL_PRESERVE_REFS.txt" <<'PY'
          import re,sys,tempfile,zipfile
          from pathlib import Path
          from tools.dex_inspect import Dex
          apk=Path(sys.argv[1]); out=Path(sys.argv[2]); lines=[]
          with tempfile.TemporaryDirectory() as td:
            td=Path(td)
            with zipfile.ZipFile(apk) as z:
              for name in sorted(n for n in z.namelist() if re.fullmatch(r'classes\d*\.dex',n)):
                p=td/name; p.write_bytes(z.read(name)); d=Dex(p)
                hits=[(i,m) for i,m in enumerate(d.methods) if 'PreserveEGLContextOnPause' in m[1] or (m[0]=='Landroid/opengl/GLSurfaceView;' and m[1] in ('onPause','onResume','setPreserveEGLContextOnPause'))]
                lines.append(f'DEX {name} preserve_refs={hits}')
                cls='Lcom/newstargames/newstarsoccer/BBAndroidGame$GameView;'
                methods=d.class_methods(cls) or []
                lines.append(f'CLASS {cls} DEX {name} declared={len(methods)}')
                for kind,mid,m,acc,code in methods:
                  if m[1] not in ('onPause','onResume','requestRender','setRenderMode','setRenderer','setFocusableInTouchMode','requestFocus'): continue
                  lines.append(f'METHOD {m[1]} id={mid} code={code:#x} access={acc:#x}')
                  if code:
                    regs,ins,outs,tries,units,items=d.disasm(code)
                    lines.append(f'  regs={regs} ins={ins} outs={outs} tries={tries} units={units}')
                    for off,op,args,raw in items:
                      lines.append(f'  {off:04x}: {raw:<24} {op:<20} {args}')
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(out.read_text())
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nss-gl-preserve-ref-inspection-20261024
          path: ${{ runner.temp }}/nss-gl-preserve/out/
          retention-days: 30
